function editRoutine(r){
  const isNew=!r;
  r = r || {id:uid(), name:'', hint:'', cadence:{type:'daily'}, slot:'evening', priority:'normal', skipRest:false, lock:'', kind:'check', goal:1, oz:0};
  const d = JSON.parse(JSON.stringify(r));
  let prio=d.priority, slot=d.slot, kind=d.kind;

  const cadBox=el('div',{});
  function drawCad(){
    cadBox.innerHTML='';
    const t=d.cadence.type;
    const typeSel=el('select',{onchange:e=>{ d.cadence={type:e.target.value, n:2, days:d.cadence.days||[new Date().getDay()], date:d.cadence.date||1, anchor:todayISO()}; drawCad(); }});
    [['daily','Every day'],['everyN','Every N days'],['weekdays','Certain weekdays'],['weeklyN','Every N weeks'],['monthly','Monthly']].forEach(([v,l])=>
      typeSel.append(el('option',{value:v, selected:v===t?'selected':null}, l)));
    cadBox.append(labeled('Repeats', typeSel));
    if(t==='everyN') cadBox.append(field('Every how many days?', numInput(d.cadence.n||2, v=>d.cadence.n=v)));
    if(t==='weeklyN') cadBox.append(field('Every how many weeks?', numInput(d.cadence.n||2, v=>d.cadence.n=v)));
    if(t==='weekdays'||t==='weeklyN') cadBox.append(labeled('On', dayChips(d.cadence.days||[], ds=>d.cadence.days=ds)));
    if(t==='monthly') cadBox.append(field('On day of month', numInput(d.cadence.date||1, v=>d.cadence.date=v)));
    if(t==='everyN'||t==='weeklyN') cadBox.append(el('div',{class:'faint tiny'},'Counts from today.'));
  }
  drawCad();

  const kindBox=el('div',{});
  function drawKind(){
    kindBox.innerHTML='';
    kindBox.append(labeled('Type', segmented([['check','Checkbox'],['counter','Counter'],['skill','Skill log']], kind, v=>{ kind=v; drawKind(); })));
    if(kind==='skill') kindBox.append(el('div',{class:'faint tiny'},'Tapping it asks which skill you practiced and for how long, and logs it on the Skills tab.'));
    if(kind==='counter') kindBox.append(el('div',{class:'grid2'},[
      field('Daily goal', numInput(d.goal||1, v=>d.goal=v)),
      field('oz each (optional)', numInput(d.oz||0, v=>d.oz=v)),
    ]));
  }
  drawKind();

  sheet(isNew?'New routine':'Edit routine', [
    field('Name', `<input id="r_name" value="${esc(d.name)}" placeholder="Stretch / Read / Call a friend">`),
    field('Hint (optional)', `<input id="r_hint" value="${esc(d.hint||'')}" placeholder="before dinner">`),
    labeled('Priority', segmented(PRIOS, prio, v=>prio=v)),
    labeled('When', segmented([['morning','Morning'],['evening','Evening'],['winddown','Wind-down']], slot, v=>slot=v)),
    cadBox,
    field('Not available until (optional time)', `<input id="r_lock" type="time" value="${d.lock||''}">`),
    checkboxRow('r_skip','Skip on rest & off nights', d.skipRest),
    kindBox,
  ], ()=>{
    d.name=$('#r_name').value.trim(); if(!d.name) return false;
    d.hint=$('#r_hint').value.trim();
    d.priority=prio; d.slot=slot; d.kind=kind;
    d.lock=$('#r_lock').value;
    d.skipRest=$('#r_skip').checked;
    if(d.cadence.type!=='everyN'&&d.cadence.type!=='weeklyN') delete d.cadence.anchor; else d.cadence.anchor=d.cadence.anchor||todayISO();
    Object.assign(r, d);
    if(isNew) S.routines.push(r);
    save(); render(); return true;
  }, isNew?null:()=>{ S.routines=S.routines.filter(x=>x!==r); save(); closeSheet(); render(); });
}

/* ===== SKILLS ===== */
function skillColorVar(k){ return `var(--p-${(k&&k.color)||'sage'})`; }
function skillMinsOn(k, iso){ return (k.sessions||[]).filter(s=>s.date===iso).reduce((t,s)=>t+(+s.min||0),0); }
function chainGrid(k, days){
  const g=el('div',{class:'chain', style:`--cols:${Math.min(days,14)};--pc:${skillColorVar(k)}`});
  const today=todayISO();
  for(let i=days-1;i>=0;i--){
    const iso=addDays(today,-i), m=skillMinsOn(k,iso);
    const lv = m>=40?3 : m>=15?2 : m>0?1 : 0;
    g.append(el('i',{'data-l':String(lv), class:i===0?'today':''}));
  }
  return g;
}
function viewSkills(app){
  app.append(el('header',{class:'hero'},[ el('div',{class:'greet'},'Practice'), el('div',{class:'sub'},'Skills you’re building. Show up, fill a square, don’t break the chain.') ]));
  app.append(el('button',{class:'btn primary block', style:'margin:6px 0 4px', onclick:()=>editSkill()}, '+ New skill'));
  if(!S.skills.length) app.append(el('div',{class:'empty'},'Nothing here yet. Drawing, an instrument, a language — anything you want to get consistently better at.'));
  S.skills.slice().sort((a,b)=>skillMinutes(b)-skillMinutes(a)).forEach(k=>{
    const c=el('div',{class:'card'});
    const lv=skillLevel(k), nx=skillNext(k), mins=skillMinutes(k), stk=skillStreak(k);
    c.append(el('div',{class:'inline', style:'gap:8px;align-items:baseline'},[
      el('h3',{class:'display', style:`flex:1;font-size:1.15rem;color:${skillColorVar(k)}`}, k.name),
      el('span',{class:'badge'}, `Level ${lv}`),
    ]));
    c.append(el('div',{class:'faint tiny', style:'margin-top:4px'},
      `${fmtDur(mins)} total${stk>1?` · \u{1f525} ${stk}-day chain`:''}${skillLastPracticed(k)?` · last ${dstr(skillLastPracticed(k))}`:''}`));
    c.append(chainGrid(k, 28));
    if(nx) c.append(el('div',{class:'faint tiny'}, `${(nx.need-nx.have).toFixed(1)} hrs to Level ${nx.lv}`));
    c.append(el('div',{class:'row-actions'},[
      el('button',{class:'btn sm primary', onclick:()=>{ let m=10; sheet('Log '+k.name,[ field('Minutes practiced', numInput(10,v=>m=v)) ], ()=>{ logSkill(k,m); return true; }); }},'Log practice'),
      el('button',{class:'btn sm', onclick:()=>editSkill(k)},'Edit'),
    ]));
    app.append(c);
  });
}
function editSkill(k){
  const isNew=!k; k=k||{id:uid(), name:'', createdAt:todayISO(), sessions:[]};
  sheet(isNew?'New skill':'Edit skill',[
    field('Name', `<input id="k_n" value="${esc(k.name)}" placeholder="Drawing">`),
    isNew?null:field('Adjust logged hours (optional)', `<input id="k_h" type="number" min="0" step="0.5" value="${(skillMinutes(k)/60).toFixed(1)}">`),
  ].filter(Boolean), ()=>{
    k.name=$('#k_n').value.trim(); if(!k.name) return false;
    if(!isNew){
      const h=parseFloat($('#k_h').value);
      if(!isNaN(h) && Math.abs(h*60 - skillMinutes(k))>1){ k.sessions=[{date:todayISO(), min:Math.round(h*60)}]; }
    }
    if(isNew) S.skills.push(k);
    save(); render(); return true;
  }, isNew?null:()=>{ S.skills=S.skills.filter(x=>x!==k); save(); closeSheet(); render(); });
}

/* ===== PLAN ===== */
function viewPlan(app){
  const {out} = buildProjection(14);
  const finishes = simFinishes() || [];
  app.append(el('header',{class:'hero'},[ el('div',{class:'greet'},'Plan'), el('div',{class:'sub'},'How the next two weeks shake out. Recalculates when anything changes.') ]));

  // headline + 7-day strip
  const wk7=out.slice(0,7);
  const fN=wk7.filter(d=>d.mode==='project'&&d.focus).length;
  const hrs=wk7.reduce((t,d)=>t+(d.focus?d.focus.mins:0),0)/60;
  const nextFin=finishes.filter(f=>f.partFinish||f.finish).sort((a,b)=>((a.partFinish||a.finish)).localeCompare(b.partFinish||b.finish))[0];
  const hl=el('div',{class:'card hl'});
  hl.append(el('div',{class:'faint tiny'},'Next 7 days'));
  hl.append(el('div',{style:'font-weight:750;font-size:1.1rem;margin-top:2px'}, `${fN} focus night${fN===1?'':'s'} · ~${hrs<1?Math.round(hrs*60)+' min':hrs.toFixed(1)+' hrs'}`));
  if(nextFin){
    const p=S.projects.find(x=>x.id===nextFin.id);
    hl.append(el('div',{class:'muted tiny', style:'margin-top:3px'},
      `finishing next: ${nextFin.name}${p&&hasParts(p)?' · '+curr(p).name:''} — ${dstr(nextFin.partFinish||nextFin.finish)}`));
  }
  const strip=el('div',{class:'weekstrip'});
  wk7.forEach(d=>{
    const cls = (d.mode==='project'&&d.focus)?'focus' : d.mode==='project'?'open' : d.mode==='rest'?'rest':'off';
    const frame=el('div',{class:'frame'});
    if(d.focus){
      const h = 40 + Math.min(60, (d.focus.mins/180)*60);   // taller frame = longer session
      frame.append(el('div',{class:'blk', style:`background:${d.focus.color};height:${h}%`}));
    } else {
      frame.append(el('div',{class:'blk'}));
    }
    if(d.events.length) frame.append(el('div',{class:'wdot'}));
    strip.append(el('div',{class:'wk '+cls+(d.iso===todayISO()?' today':'')},[
      el('span',{class:'dl'}, d.iso===todayISO()?'TDY':WD1[d.dow]),
      frame,
    ]));
  });
  hl.append(strip);

  // project lanes
  const lanes=planLanes();
  if(lanes.length){
    const lw=el('div',{class:'lanes'});
    lanes.forEach(L=>{
      const track=el('div',{class:'track'});
      const seg=el('div',{class:'seg'+(L.late?' late':'')});
      seg.style.width=Math.max(4,L.pct)+'%';
      seg.style.background=L.color;
      track.append(seg);
      if(L.flag!=null){
        const fl=el('div',{class:'flag'+(L.tight?' tight':'')});
        fl.style.left=Math.min(99,Math.max(1,L.flag))+'%';
        track.append(fl);
      }
      lw.append(el('div',{class:'lane'},[ el('div',{class:'ln'}, L.p.name), track ]));
    });
    lw.append(el('div',{class:'scale'},[ el('span',{},'today'), el('span',{}, dstr(addDays(todayISO(), planSpan()))) ]));
    hl.append(el('div',{class:'faint tiny', style:'margin-top:14px'},'Where each project lands · flag = deadline'));
    hl.append(lw);
  }
  app.append(hl);

  // agenda
  const ag=el('div',{class:'card'});
  out.forEach(d=>{
    const type = (d.mode==='project'&&d.focus)?'focus' : d.mode==='rest'?'rest' : d.mode==='off'?'off':'open';
    const row=el('div',{class:'agrow'});
    row.append(el('div',{class:'marker '+type, style: d.focus?`background:${d.focus.color}`:''}));
    const mid=el('div',{style:'flex:1;min-width:0'});
    mid.append(el('div',{style:'font-weight:650;font-size:.8rem;color:var(--muted)'},
      d.iso===todayISO()?'Today':new Date(d.iso+'T00:00').toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})));
    if(d.focus){
      mid.append(el('div',{style:`font-weight:600;margin-top:1px;color:${d.focus.color}`}, d.focus.name + (d.focus.part?' · '+d.focus.part:'')));
      mid.append(el('div',{class:'faint tiny'}, `${d.focus.amount} ${d.focus.unit} · ${fmtDur(d.focus.mins)}${d.focus.note||''}`));
    } else {
      mid.append(el('div',{class:'faint', style:'margin-top:1px'}, d.mode==='rest'?'Rest night' : d.mode==='off'?'Off' : 'Focus night — open'));
    }
    d.events.forEach(ev=> mid.append(el('div',{class:'tiny', style:'color:var(--accent);margin-top:2px'}, '\u{1f4c5} '+ev)));
    row.append(mid);
    ag.append(row);
  });
  app.append(ag);

  const fin=finishes.filter(f=>f.deadline);
  if(fin.length){
    const fc=el('div',{class:'card'});
    fc.append(el('h3',{},'Deadlines'));
    fin.forEach(f=>{
      const p=S.projects.find(x=>x.id===f.id);
      const target = f.partFinish || f.finish;
      const label = (p && hasParts(p)) ? `${f.name} · ${curr(p).name}` : f.name;
      let color='var(--good)', txt;
      if(!target){ color='var(--bad)'; txt='won’t finish'; }
      else if(target>f.deadline){ color='var(--bad)'; txt=`${daysBetween(f.deadline,target)}d late`; }
      else if(daysBetween(todayISO(),f.deadline)<=7){ color='var(--warn)'; txt='done '+dstr(target); }
      else txt='done '+dstr(target);
      fc.append(el('div',{class:'weekrow'},[
        el('div',{class:'inline', style:'gap:8px;min-width:0'},[ el('span',{class:'sdot', style:`background:${color}`}), el('div',{style:'min-width:0'}, label) ]),
        el('div',{class:'tiny', style:`color:${color};white-space:nowrap`}, txt),
      ]));
    });
    app.append(fc);
  }

  app.append(el('div',{class:'divider'}));
  app.append(el('h2',{class:'hpad', style:'margin-bottom:2px'},'Setup'));

  const modes={project:'Focus night', rest:'Rest night', off:'Off'};
  const wc=el('div',{class:'card'});
  wc.append(el('h3',{},'Week shape'));
  for(let i=1;i<=6;i++) wc.append(weekRow(i,modes));
  wc.append(weekRow(0,modes));
  wc.append(el('div',{class:'faint tiny', style:'margin-top:10px'}, `${focusNightsPerWeek()} focus nights a week${focusActive()?' (Focus Mode is bumping this)':''}.`));
  app.append(wc);

  const cm=el('div',{class:'card'});
  cm.append(el('h3',{},'Commitments'));
  cm.append(el('div',{class:'faint tiny', style:'margin:6px 0 10px'},'An evening one cancels that night’s focus block.'));
  S.events.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).forEach(e=>{
    cm.append(el('div',{class:'weekrow'},[
      el('div',{},[ el('div',{}, e.title), el('div',{class:'faint tiny'}, dstr(e.date)+(e.time?' · '+fmtHM(parseHM(e.time)):'')) ]),
      el('button',{class:'del', onclick:()=>{ S.events=S.events.filter(x=>x!==e); save(); render(); }},'Remove'),
    ]));
  });
  if(!S.events.length) cm.append(el('div',{class:'empty tiny'},'Nothing booked.'));
  cm.append(el('button',{class:'btn sm block', style:'margin-top:10px', onclick:()=>addEvent()},'+ Add commitment'));
  app.append(cm);

  const tc=el('div',{class:'card'});
  tc.append(el('h3',{},'Tasks'));
  tc.append(el('div',{class:'faint tiny', style:'margin:6px 0 10px'},'One-offs. Dated or Must-do ones show on Today.'));
  S.tasks.filter(t=>!t.done).sort((a,b)=>prW(b.priority)-prW(a.priority) || (a.due||'~').localeCompare(b.due||'~')).forEach(t=>{
    tc.append(el('div',{class:'weekrow'},[
      el('div',{class:'inline', style:'gap:8px'},[ el('div',{class:'dot '+t.priority}), el('div',{},[ el('div',{}, t.text), el('div',{class:'faint tiny'}, t.due?dstr(t.due):'no date') ]) ]),
      el('div',{class:'inline'},[
        el('button',{class:'btn sm', onclick:()=>editTask(t)},'Edit'),
        el('button',{class:'del', onclick:()=>{ S.tasks=S.tasks.filter(x=>x!==t); save(); render(); }},'✕'),
      ]),
    ]));
  });
  if(!S.tasks.filter(t=>!t.done).length) tc.append(el('div',{class:'empty tiny'},'None.'));
  tc.append(el('button',{class:'btn sm block', style:'margin-top:10px', onclick:()=>editTask()},'+ Add task'));
  app.append(tc);
}
function dstr(iso){ return new Date(iso+'T00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}); }
function weekRow(i,modes){
  const r=el('div',{class:'weekrow'});
  r.append(el('div',{}, WD[i]));
  const sel=el('select',{onchange:e=>{ S.week[i]=e.target.value; save(); render(); }});
  for(const k in modes) sel.append(el('option',{value:k, selected:S.week[i]===k?'selected':null}, modes[k]));
  r.append(sel);
  return r;
}
function addEvent(){
  const e={id:uid(), date:todayISO(), time:'', title:''};
  sheet('Add commitment',[
    field('What', `<input id="e_t" placeholder="Dinner with friends">`),
    field('Day', `<input id="e_d" type="date" value="${todayISO()}">`),
    field('Time (optional)', `<input id="e_tm" type="time">`),
  ], ()=>{ e.title=$('#e_t').value.trim(); if(!e.title) return false; e.date=$('#e_d').value||todayISO(); e.time=$('#e_tm').value; S.events.push(e); save(); render(); return true; });
}
function editTask(t){
  const isNew=!t; t=t||{id:uid(), text:'', due:'', priority:'normal', done:false};
  let prio=t.priority;
  sheet(isNew?'Add task':'Edit task',[
    field('Task', `<input id="t_text" value="${esc(t.text)}" placeholder="e.g. Book dentist appointment">`),
    labeled('Priority', segmented(PRIOS, prio, v=>prio=v)),
    field('Day (optional)', `<input id="t_due" type="date" value="${t.due||''}">`),
  ], ()=>{ t.text=$('#t_text').value.trim(); if(!t.text) return false; t.priority=prio; t.due=$('#t_due').value; if(isNew) S.tasks.push(t); save(); render(); return true; },

}

/* ===== WEEK RECAP ===== */
function weekStartISO(iso){ const d=new Date(iso+'T00:00'); return addDays(iso, -((d.getDay()+6)%7)); } // Monday
function weekRecap(startOverride){
  const today=todayISO(), start=startOverride || weekStartISO(today);
  const end = startOverride ? addDays(start,6) : today;
  const inWk = d => d && d>=start && d<=end;
  const span = daysBetween(start, end)+1;
  const wrapped = S.projects.filter(p=>p.archived && inWk(p.completedAt));
  let tasksDone=0, subsDone=0;
  S.projects.forEach(p=>(p.parts||[]).forEach(t=>{
    if(inWk(t.completedAt)) tasksDone++;
    (t.subs||[]).forEach(s=>{ if(inWk(s.completedAt)) subsDone++; });
  }));
  const psess=(S.sessions||[]).filter(s=>inWk(s.date));
  const projMin=psess.reduce((a,s)=>a+s.min,0);
  const skl=[]; S.skills.forEach(k=>(k.sessions||[]).forEach(s=>{ if(inWk(s.date)) skl.push({name:k.name, min:s.min, color:skillColorVar(k)}); }));
  const skillMin=skl.reduce((a,s)=>a+s.min,0);
  const bySkill={}; skl.forEach(s=>{ bySkill[s.name]=(bySkill[s.name]||0)+s.min; });
  let focusNights=0; for(let i=0;i<span;i++){ if(dayChecks(addDays(start,i)).focus) focusNights++; }
  const xpWk=(S.xpLog||[]).filter(e=>inWk(e.d) && e.amt>0).reduce((a,e)=>a+e.amt,0);
  const fins=(simFinishes()||[]).filter(f=>f.partFinish||f.finish)
    .sort((a,b)=>(a.partFinish||a.finish).localeCompare(b.partFinish||b.finish));
  return {start, end, span, wrapped, tasksDone, subsDone, projMin, skillMin, bySkill, focusNights, xpWk,
    sessions:psess.length, done: tasksDone+subsDone, next:fins[0], quiet:(tasksDone+subsDone+wrapped.length+psess.length+skl.length)===0};
}

  const range = `${new Date(r.start+'T00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})} – ${new Date(r.end+'T00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})}`;
  app.append(el('header',{class:'hero'},[

function exportData(){

  document.body.append(a); a.click(); a.remove();

function mergeById(local, incoming){
  const have=new Set((local||[]).map(x=>x&&x.id));
  (incoming||[]).forEach(x=>{ if(x && x.id && !have.has(x.id)) local.push(x); });
}
function applyImport(raw, mode){
  const inc=Object.assign(structuredClone(DEFAULTS), raw); migrate(inc);
  if(mode==='replace'){ S=inc; save(); buildNav(); render(); return; }
  mergeById(S.projects, inc.projects);
  mergeById(S.routines, inc.routines);
  mergeById(S.tasks, inc.tasks);
  mergeById(S.events, inc.events);
  const skMap=new Map(S.skills.map(k=>[k.id,k]));
  inc.skills.forEach(k=>{ const cur=skMap.get(k.id);
    if(!cur) S.skills.push(k); else mergeById(cur.sessions=cur.sessions||[], k.sessions); });
  mergeById(S.sessions, inc.sessions);
  const stTs=new Set((S.starts||(S.starts=[])).map(x=>x.ts));
  (inc.starts||[]).forEach(x=>{ if(!stTs.has(x.ts)) S.starts.push(x); });
  const xpTs=new Set((S.xpLog||[]).map(e=>e.ts));
  (inc.xpLog||[]).forEach(e=>{ if(!xpTs.has(e.ts)) S.xpLog.push(e); });
  S.xpLog.sort((a,b)=>b.ts-a.ts); if(S.xpLog.length>250) S.xpLog.length=250;
  for(const d in inc.checks) S.checks[d]=Object.assign({}, inc.checks[d], S.checks[d]);
  for(const id in inc.counters){ S.counters[id]=S.counters[id]||{};
    for(const d in inc.counters[id]) if(S.counters[id][d]==null) S.counters[id][d]=inc.counters[id][d]; }
  S.xp=Math.max(S.xp, inc.xp||0);
  save(); render();
}

  const inp=el('input',{type:'file', accept:'.json,application/json'});
  inp.addEventListener('change',()=>{ const f=inp.files[0]; if(!f) return; const rd=new FileReader();
    rd.onload=()=>{ let raw; try{ raw=JSON.parse(rd.result); }catch(e){ alert('That doesn’t look like a Jarvis backup.'); return; }
      const dlg=$('#sheet'); dlg.innerHTML=''; dlg.className='centered'; dlg.style.display='';
      const box=el('div',{class:'sheet'});

      box.append(el('p',{class:'muted tiny', style:'margin:6px 0 0'}, 'Merge keeps what’s on this device and adds anything missing. Replace wipes this device and loads the file as-is.'));
      const acts=el('div',{class:'row-actions', style:'margin-top:16px'});
      acts.append(el('button',{class:'btn primary', onclick:()=>{ applyImport(raw,'merge'); closeSheet(); }},'Merge'));
      acts.append(el('button',{class:'btn ghost', onclick:closeSheet},'Cancel'));
      const rb=armDelete('Replace', ()=>{ applyImport(raw,'replace'); closeSheet(); }); rb.style.marginLeft='auto'; acts.append(rb);
      box.append(acts); dlg.append(box);
      if(typeof dlg.showModal==='function'){ if(!dlg.open) dlg.showModal(); }
      else { dlg.setAttribute('open',''); dlg.style.cssText='display:block;position:fixed;inset:0;z-index:100'; }
    };
    rd.readAsText(f); });
  inp.click();
}

  if(!S.lastBackup) return null;
  const n=daysBetween(S.lastBackup, todayISO());

  }
  function capture(){
    if(st.step===0){ st.name=$('#w_name').value; st.asst=$('#w_asst').value; if($('#w_craft')) st.craft=$('#w_craft').value; st.wake=$('#w_wake').value; st.home=$('#w_home').value; }
    if(st.step===1){ st.rc=$('#w_rc').value; }
    if(st.step===2){ st.sc=$('#w_sc').value; }
  }
  function draw(){
    dlg.innerHTML=''; dlg.style.display='';
    const box=el('div',{class:'sheet'});
    box.append(el('div',{class:'wizdots'}, [0,1,2,3].map(i=>el('i',{class:i<=st.step?'on':''}))));
    if(st.step===0){
      box.append(el('h2',{}, 'Let’s set up.'));
      box.append(el('p',{class:'muted', style:'margin:4px 0 8px'}, 'I hold your whole to-do list and hand you one clear plan each night. First, the basics:'));
      box.append(field('Your name', `<input id="w_name" value="${esc(st.name)}" placeholder="Your first name">`));
      box.append(field('What should I go by?', `<input id="w_asst" value="${esc(st.asst)}" placeholder="Jarvis">`));
      box.append(field('What’s your craft?', `<select id="w_craft">${Object.keys(CRAFTS).map(k=>`<option value="${k}"${st.craft===k?' selected':''}>${CRAFTS[k].label}</option>`).join('')}</select>`));
      box.append(field('Wake-up time you’re aiming for', `<input id="w_wake" type="time" value="${st.wake}">`));
      box.append(field('When you get home from work', `<input id="w_home" type="time" value="${st.home}">`));
    } else if(st.step===1){
      box.append(el('h2',{}, 'What would you like to fit into your day?'));
      box.append(el('p',{class:'muted', style:'margin:4px 0 10px'}, 'Tap what fits. Cadence and timing are adjustable later in Routines.'));
      box.append(chipRow(RPRE, st.routines));
      box.append(field('Add your own (comma-separated)', `<input id="w_rc" value="${esc(st.rc)}" placeholder="Journaling, stretch">`));
    } else if(st.step===2){
      box.append(el('h2',{}, 'Anything you want to get better at?'));
      box.append(el('p',{class:'muted', style:'margin:4px 0 10px'}, 'These become Skills you level up. If you pick any, a nightly “practice a skill” routine is added.'));
      box.append(chipRow(SPRE, st.skills));
      box.append(field('Add your own', `<input id="w_sc" value="${esc(st.sc)}" placeholder="Screenwriting">`));
    } else {
      box.append(el('h2',{}, 'A project to aim at'));
      box.append(el('p',{class:'muted', style:'margin:4px 0 10px'}, 'Jarvis works best pointed at something with a finish line — a script, a season, a record. Set one up now, or add it later from the Studio.'));
    }
    const acts=el('div',{class:'row-actions', style:'margin-top:16px'});
    if(st.step>0) acts.append(el('button',{class:'btn ghost', onclick:()=>{ capture(); st.step--; draw(); }},'Back'));
    if(st.step<3){
      if(st.step>=1) acts.append(el('button',{class:'btn ghost', onclick:()=>{ capture(); st.step++; draw(); }},'Skip'));
      acts.append(el('button',{class:'btn primary', style:'margin-left:auto', onclick:()=>{ capture(); st.step++; draw(); }},'Next'));
    } else {
      acts.append(el('button',{class:'btn ghost', onclick:()=>finish(false)},'Not now'));
      acts.append(el('button',{class:'btn primary', style:'margin-left:auto', onclick:()=>finish(true)},'Set one up'));
    }
    box.append(acts);
    dlg.append(box);
    if(typeof dlg.showModal==='function'){ if(!dlg.open) dlg.showModal(); }
    else { dlg.setAttribute('open',''); dlg.style.cssText='display:block;position:fixed;inset:auto 0 0 0;z-index:100'; }
  }
  function finish(addProject){
    S.user=(st.name||'').trim()||'there';
    S.assistant=(st.asst||'').trim()||'Jarvis';
    S.craft=st.craft||'other';
    if(st.wake) S.wakeOverride=st.wake;
    if(st.home) S.workEnd=fmt24(parseHM(st.home)-S.driveMin);
    [...st.routines, ...st.rc.split(',').map(x=>x.trim()).filter(Boolean)].forEach(name=>{
      const pre=RPRE.find(p=>p[0]===name);
      const isWater=/water/i.test(name);
      S.routines.push({id:uid(), name, hint:'', cadence:{type:'daily'}, slot:pre?pre[1]:'evening', priority:pre?pre[2]:'normal',
        skipRest:false, lock:'', kind:isWater?'counter':'check', goal:isWater?2:1, oz:0});
    });
    const slist=[...st.skills, ...st.sc.split(',').map(x=>x.trim()).filter(Boolean)];
    slist.forEach(name=> S.skills.push({id:uid(), name, createdAt:todayISO(), sessions:[]}));
    if(slist.length && !S.routines.some(r=>r.kind==='skill'))
      S.routines.push({id:uid(), name:'Practice a skill', hint:'10 minutes — pick one', cadence:{type:'daily'}, slot:'winddown', priority:'low', skipRest:false, lock:'', kind:'skill', goal:1, oz:0});
    S.onboarded=true; save(); closeSheet(); render();
    if(addProject) newProject();
  }
  draw();
}
function fmt24(m){ m=((m%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }

/* ---------- wind-down reminder ----------
   iOS has no way to schedule a local notification and no push without a server,
   so this is best-effort: a timer that fires showNotification() while the app is
   alive (reliable on desktop/Android, hit-or-miss on a backgrounded iOS PWA),
   backed by an on-open catch-up nudge and a downloadable repeating .ics alarm
   that iOS Calendar fires natively. */
let _wdTimer=null;
function notifyOK(){ return typeof Notification!=='undefined' && Notification.permission==='granted'; }
function armWindDownReminder(){
  clearTimeout(_wdTimer); _wdTimer=null;
  if(!S.remind || !S.remind.winddown || !notifyOK()) return;
  const now=new Date(), nowMin=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;
  const target=((windDownMin()%1440)+1440)%1440;
  let delay=(target-nowMin)*60000;
  if(delay < -30*60000) return;        // >30 min past — let it go tonight
  if(delay > 8*3600000) return;        // too far out — re-armed when the app is next opened
  _wdTimer=setTimeout(fireWindDownReminder, Math.max(500, delay));
}
function fireWindDownReminder(){
  const iso=todayISO();
  if(!S.remind.winddown || !notifyOK() || dayChecks(iso).__wdNotified) return;
  dayChecks(iso).__wdNotified=true; save();
  const title=`${S.assistant} — wind-down`;
  const body=`Start wrapping up. Shower, phone across the room, in bed by ${fmtHM(asleepMin())}.`;
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.ready)
      navigator.serviceWorker.ready
        .then(reg=>reg.showNotification(title, {body, tag:'winddown', icon:'icon-192.png', badge:'icon-192.png'}))
        .catch(()=>{ try{ new Notification(title,{body}); }catch(e){} });
    else new Notification(title, {body});
  }catch(e){}
}
function downloadWindDownICS(){
  const m=((windDownMin()%1440)+1440)%1440, e=(m+15)%1440;
  const p2=n=>String(n).padStart(2,'0');
  const hm=x=>p2(Math.floor(x/60))+p2(x%60)+'00';
  const d=new Date(), dt=`${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}`;
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const ics=[
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Jarvis//Wind-down//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'BEGIN:VEVENT',`UID:jarvis-winddown-${Date.now()}@jarvis.local`,`DTSTAMP:${stamp}`,
    `DTSTART:${dt}T${hm(m)}`,`DTEND:${dt}T${hm(e)}`,'RRULE:FREQ=DAILY',
    'SUMMARY:Wind-down — start wrapping up',
    `DESCRIPTION:Shower\\, phone across the room\\, in bed by ${fmtHM(asleepMin())}.`,
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Wind-down','TRIGGER:PT0S','END:VALARM',
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  const a=el('a',{href:URL.createObjectURL(new Blob([ics],{type:'text/calendar'})), download:'jarvis-winddown.ics'});
  document.body.append(a); a.click(); a.remove();
}

/* ---------- boot ---------- */
let lastDay=todayISO();
setInterval(()=>{ const t=todayISO(); if(t!==lastDay){ lastDay=t; skipTonight.clear(); render(); armWindDownReminder(); } }, 60000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ render(); ensureTick(); armWindDownReminder(); } });
buildNav(); render(); onboard(); ensureTick(); armWindDownReminder();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
