<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis</title>
<meta name="theme-color" content="#111318">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#0f1115; --surface:#171a21; --surface-2:#1e222b; --line:#2a2f3a;
    --text:#e8eaf0; --muted:#9aa2b1; --faint:#6b7280;
    --accent:#7aa2ff; --accent-ink:#0b1220;
    --good:#43c59e; --warn:#e0b453; --bad:#e0685f;
    --radius:16px; --tap:48px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f4f5f8; --surface:#ffffff; --surface-2:#eef0f4; --line:#e0e3ea;
      --text:#1c1f26; --muted:#5b6472; --faint:#8a93a2;
      --accent:#3860e0; --accent-ink:#ffffff;
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    background:var(--bg); color:var(--text);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-bottom:calc(58px + var(--safe-b));
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px; margin:0 auto; padding:16px 16px 4px}
  .foot{text-align:center; color:var(--faint); font-size:.7rem; letter-spacing:.08em; padding:18px 0 6px; opacity:.6}
  h1,h2,h3{margin:0; font-weight:650; line-height:1.25}
  h2{font-size:1.05rem}
  h3{font-size:1rem}
  .muted{color:var(--muted)} .faint{color:var(--faint)}
  button{font:inherit; color:inherit; cursor:pointer}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin:12px 0}

  header.hero{padding:20px 0 4px}
  .hero .greet{font-size:1.5rem; font-weight:680}
  .hero .sub{color:var(--muted); margin-top:2px; font-size:.95rem}
  .clockline{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
  .pill{background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:5px 11px; font-size:.82rem; color:var(--muted); white-space:nowrap}
  .pill b{color:var(--text); font-weight:600}
  .pill.alert{border-color:var(--warn); color:var(--warn)} .pill.alert b{color:var(--warn)}

  .prog{display:flex; align-items:center; gap:12px; margin:14px 0 2px}
  .ring{--p:0; width:52px; height:52px; border-radius:50%; flex:0 0 auto;
    background:conic-gradient(var(--good) calc(var(--p)*1%), var(--surface-2) 0);
    display:grid; place-items:center; position:relative}
  .ring::after{content:""; position:absolute; inset:5px; border-radius:50%; background:var(--surface)}
  .ring span{position:relative; font-size:.8rem; font-weight:700}

  .sec{margin-top:16px}
  .sec>h2{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px; font-size:1.05rem}
  .sec>h2 .hint{font-size:.78rem; font-weight:500; color:var(--faint)}

  .row{display:flex; align-items:center; gap:12px; padding:13px 12px; background:var(--surface);
    border:1px solid var(--line); border-radius:12px; margin:8px 0; min-height:var(--tap)}
  .row.tap{cursor:pointer; user-select:none}
  .row.done{opacity:.55}
  .row.done .tx .t{text-decoration:line-through}
  .box{width:24px; height:24px; border-radius:7px; border:2px solid var(--faint); flex:0 0 auto; display:grid; place-items:center; transition:.12s}
  .row.done .box, .sub.done .box{background:var(--good); border-color:var(--good)}
  .box svg{width:14px; height:14px; opacity:0; color:#04140f}
  .row.done .box svg, .sub.done .box svg{opacity:1}
  .row .tx{flex:1; min-width:0}
  .row .tx .t{font-weight:550}
  .row .tx .d{font-size:.8rem; color:var(--muted)}
  .row .rt{font-size:.75rem; color:var(--faint); white-space:nowrap}
  .row.locked{opacity:.5}
  .row.note{display:block; color:var(--muted); font-size:.92rem; background:var(--surface-2); border-style:dashed}
  .streak{font-size:.72rem; color:var(--warn); font-weight:600; white-space:nowrap}
  .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .dot.must{background:var(--bad)} .dot.normal{background:var(--accent)} .dot.low{background:var(--faint)}

  .focuscard{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset}
  .focuscard .t{font-size:1.05rem}
  .badge{font-size:.72rem; font-weight:650; padding:2px 8px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); white-space:nowrap}
  .badge.soon{color:var(--warn); border-color:var(--warn)}
  .badge.over{color:var(--bad); border-color:var(--bad)}
  .badge.ok{color:var(--good); border-color:var(--good)}
  .deadline{font-size:.8rem; font-weight:600}
  .deadline.soon{color:var(--warn)} .deadline.over{color:var(--bad)}
  .sub-list{margin-top:8px; border-top:1px solid var(--line); padding-top:6px}
  .sub{display:flex; align-items:center; gap:10px; padding:8px 2px; font-size:.92rem; cursor:pointer}
  .sub .box{width:20px;height:20px;border-radius:6px}
  .sub.done .s{text-decoration:line-through; opacity:.6}
  .stepper{display:flex; align-items:center; gap:10px; margin-top:8px}
  .stepper button{width:38px; height:38px; border-radius:9px; border:1px solid var(--line); background:var(--surface-2); font-size:1.2rem}
  .stepper .val{font-weight:700; font-size:1rem; min-width:74px; text-align:center}

  nav{position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line);
    display:flex; padding-bottom:var(--safe-b); z-index:50}
  nav button{flex:1; background:none; border:0; padding:7px 1px 8px; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--faint); font-size:.6rem}
  nav button.on{color:var(--accent)}
  nav svg{width:20px; height:20px}

  /* momentum */
  .mo{display:flex; gap:10px; align-items:center; margin:12px 0 2px; flex-wrap:wrap}
  .mo .chip2{display:inline-flex; align-items:center; gap:5px; background:var(--surface-2); border:1px solid var(--line);
    border-radius:999px; padding:5px 11px; font-size:.82rem; font-weight:650}
  .mo .chip2.xp{color:var(--accent)} .mo .chip2.streak{color:var(--warn)}
  .xpbar{height:5px; border-radius:999px; background:var(--surface-2); overflow:hidden; flex:1 1 100%; margin-top:2px}
  .xpbar>i{display:block; height:100%; background:var(--accent); transition:width .5s cubic-bezier(.2,.8,.2,1)}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
  .box.pop{animation:pop .32s ease}
  @keyframes ringflash{0%{box-shadow:0 0 0 0 var(--good)}100%{box-shadow:0 0 0 14px transparent}}
  .ring.cleared{animation:ringflash .7s ease-out}

  .focusbanner{background:var(--surface-2); border:1px solid var(--accent);
    box-shadow:0 0 0 1px var(--accent) inset; border-radius:var(--radius); padding:14px; margin:12px 0}
  .focusbanner .ttl{font-weight:750; font-size:1.05rem; display:flex; align-items:center; gap:7px}
  .focusbanner .eta{font-size:.82rem; color:var(--muted); margin-top:3px}

  .celebrate{position:fixed; inset:0; z-index:200; display:grid; place-items:center; background:rgba(6,8,12,.72);
    backdrop-filter:blur(3px); text-align:center; padding:24px; animation:fade .25s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .celebrate .big{font-size:2.4rem; font-weight:800; letter-spacing:.02em}
  .celebrate .sub2{color:var(--muted); margin-top:8px; font-size:1rem}
  .celebrate .kicker{color:var(--accent); font-weight:700; letter-spacing:.14em; font-size:.85rem; text-transform:uppercase}
  .conf{position:fixed; inset:0; z-index:199; overflow:hidden; pointer-events:none}
  .conf i{position:absolute; top:-12px; width:9px; height:14px; border-radius:2px; animation:drop linear forwards}
  @keyframes drop{to{transform:translateY(110vh) rotate(720deg)}}

  .lvlcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin:12px 0}
  .lvlcard .lv{font-size:1.6rem; font-weight:800}
  .statgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px}
  .statgrid .s{background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:11px}
  .statgrid .s b{display:block; font-size:1.3rem; font-weight:750}
  .statgrid .s span{font-size:.76rem; color:var(--muted)}
  .feed div{padding:8px 0; border-bottom:1px solid var(--line); font-size:.86rem; display:flex; justify-content:space-between; gap:10px}
  .feed div:last-child{border-bottom:0}
  .feed .amt{color:var(--accent); font-weight:700; white-space:nowrap}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 14px; border-radius:11px;
    border:1px solid var(--line); background:var(--surface-2); font-weight:600; font-size:.9rem}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .btn.ghost{background:none}
  .btn.sm{padding:7px 10px; font-size:.82rem}
  .btn.block{display:flex; width:100%}
  .row-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
  label.field{display:block; margin:12px 0}
  label.field .lab{font-size:.82rem; color:var(--muted); margin-bottom:5px; display:block}
  input,select,textarea{width:100%; font:inherit; color:var(--text); background:var(--surface-2);
    border:1px solid var(--line); border-radius:10px; padding:10px 12px}
  textarea{min-height:60px; resize:vertical}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .inline{display:flex; gap:8px; align-items:center}
  .seg{display:flex; gap:6px; flex-wrap:wrap}
  .seg-b{padding:7px 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface-2); font-size:.82rem; font-weight:600}
  .seg-b.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .chips{display:flex; gap:7px; flex-wrap:wrap}
  .chip{padding:9px 13px; border-radius:999px; border:1px solid var(--line); background:var(--surface-2); font-size:.86rem; font-weight:600}
  .chip.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .wizdots{display:flex; gap:5px; margin-bottom:14px}
  .wizdots>i{height:4px; flex:1; border-radius:2px; background:var(--surface-2)}
  .wizdots>i.on{background:var(--accent)}
  .daychips{display:flex; gap:5px}
  .daychips button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);font-size:.78rem;font-weight:600}
  .daychips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  dialog{border:0; border-radius:18px 18px 0 0; padding:0; width:100%; max-width:560px; margin:auto auto 0; background:var(--surface); color:var(--text)}
  dialog::backdrop{background:rgba(0,0,0,.5)}
  .sheet{padding:18px 16px calc(20px + var(--safe-b)); max-height:88vh; overflow-y:auto}
  .sheet h2{margin-bottom:4px}
  .weekrow{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line)}
  .weekrow:last-child{border-bottom:0}
  .weekrow select{width:auto; flex:1; max-width:180px}
  .del{color:var(--bad); background:none; border:0; font-size:.85rem; font-weight:600}
  .empty{text-align:center; color:var(--muted); padding:26px 10px}
  .tiny{font-size:.75rem}
  .divider{height:1px; background:var(--line); margin:16px 0}
  .bar{height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden; margin-top:8px}
  .bar>i{display:block; height:100%; background:var(--accent)}
  .hl{background:var(--surface-2)}
  .weekstrip{display:flex; gap:5px; margin-top:12px}
  .wk{flex:1; height:40px; border-radius:9px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:.7rem; font-weight:700}
  .wk.focus{background:var(--accent); color:var(--accent-ink)}
  .wk.open{background:var(--surface); color:var(--muted); border:1px solid var(--line)}
  .wk.rest{background:var(--surface); color:var(--faint); border:1px solid var(--line)}
  .wk.off{border:1px dashed var(--line); color:var(--faint)}
  .wk.today{box-shadow:0 0 0 2px var(--text)}
  .wk .wdot{width:4px; height:4px; border-radius:50%; background:currentColor}
  .agrow{display:flex; gap:11px; padding:11px 0; border-bottom:1px solid var(--line)}
  .agrow:last-child{border-bottom:0}
  .agrow .marker{width:3px; border-radius:2px; flex:0 0 auto; background:var(--line)}
  .agrow .marker.focus{background:var(--accent)}
  .agrow .marker.rest,.agrow .marker.open{background:var(--surface-2)}
  .agrow .marker.off{background:transparent}
  .sdot{width:8px; height:8px; border-radius:50%; flex:0 0 auto}
  .stagestrip{display:flex; flex-direction:column; gap:4px; margin:10px 0 2px; border-left:2px solid var(--line); padding-left:10px}
  .stg{font-size:.85rem; color:var(--faint); display:flex; gap:7px; align-items:center}
  .stg .stgdot{width:14px; text-align:center; font-weight:700}
  .stg.active{color:var(--text); font-weight:600}
  .stg.active .stgdot{color:var(--accent)}
  .stg.done{color:var(--muted)} .stg.done .stgdot{color:var(--good)}
  .stagerow{display:flex; gap:6px; align-items:center; margin:6px 0}
  .stagerow input[type=text],.stagerow input:not([type]){flex:1; min-width:0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav id="nav"></nav>
<dialog id="sheet"></dialog>

<script>
"use strict";
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,props={},kids=[])=>{const e=document.createElement(t);for(const k in props){if(k==='class')e.className=props[k];else if(k==='html')e.innerHTML=props[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),props[k]);else if(props[k]!=null)e.setAttribute(k,props[k]);}for(const c of [].concat(kids))if(c!=null)e.append(c.nodeType?c:document.createTextNode(c));return e;};
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><path d="M20 6L9 17l-5-5"/></svg>';
const WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const WD1=['S','M','T','W','T','F','S'];
const PRIOS=[['must','Must'],['normal','Normal'],['low','Low']];
function prW(p){ return p==='must'?3:p==='low'?1:2; }

/* ---------- storage ---------- */
const KEY='pa.v1';
// Ships blank. Everything is created on-device via the setup flow and stored in
// localStorage — nothing personal lives in this file or the repo.
const DEFAULTS={
  user:'there', assistant:'Jarvis',
  workStart:'08:00', driveMin:15, morningMin:30,
  wakeOverride:'', sleepGoalH:8, workEnd:'17:00',
  week:{0:'project',1:'project',2:'rest',3:'project',4:'rest',5:'off',6:'project'},
  projects:[], routines:[], skills:[], events:[], tasks:[], checks:{}, counters:{},
  xp:0, xpLog:[], focus:null, onboarded:false,
};

let S = load();
function load(){
  let raw=null;
  try{ raw=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  const s = raw ? Object.assign(structuredClone(DEFAULTS), raw) : structuredClone(DEFAULTS);
  migrate(s);
  return s;
}
function migrate(s){
  ['screen','edmontaskLeft','edmontaskPerSession','rails','waterGoal','bottleOz'].forEach(k=>delete s[k]);
  s.counters = s.counters || {};
  if(s.water){ s.counters.water = Object.assign({}, s.counters.water, s.water); delete s.water; }
  for(const k in s.week) if(s.week[k]==='edmontask') s.week[k]='project';
  s.projects = (s.projects||[]).map(p=>{ const q=Object.assign({
    id:uid(), name:'', deadline:'', unitLabel:'task', perSession:2, minPerSession:45, priority:'normal', notes:'', subs:[], parts:[], pinned:false, archived:false, lastWorked:''
  }, p); delete q.active;
    const src = q.parts && q.parts.length ? q.parts : (q.stages||[]);
    q.parts = src.map(s=>{
      let subs = (s.subs && s.subs.length) ? s.subs.map(x=>({text:x.text||'', done:!!x.done}))
        : ((+s.total||0) > 1 ? Array.from({length:+s.total},(_,i)=>({text:'Step '+(i+1), done:i<(+s.done||0)}))
        : [{text:s.name||'Complete', done:!!s.complete}]);
      return {id:s.id||uid(), name:s.name||'', deadline:s.deadline||'', complete:!!s.complete, subs};
    });
    if(!q.parts.length && (!q.subs || !q.subs.length) && (+p.total||0) > 1){
      const lbl=(p.unitLabel||'Item').replace(/s$/i,'');
      q.subs = Array.from({length:+p.total},(_,i)=>({text:lbl+' '+(i+1), done:i<(+p.done||0)}));
    }
    q.subs = (q.subs||[]).map(x=>({text:x.text||'', done:!!x.done}));
    delete q.stages; delete q.total; delete q.done; delete q.unitLabel;
    return q; });
  s.routines = (s.routines||[]).map(r=>Object.assign({
    id:uid(), name:'', hint:'', cadence:{type:'daily'}, slot:'evening', priority:'normal', skipRest:false, lock:'', kind:'check', goal:1, oz:0
  }, r));
  s.tasks = (s.tasks||[]).map(t=>Object.assign({id:uid(), text:'', due:'', priority:'normal', done:false}, t));
  s.skills = (s.skills||[]).map(k=>Object.assign({id:uid(), name:'', createdAt:todayISO(), sessions:[]}, k));
  s.xp = +s.xp||0; s.xpLog = s.xpLog||[];
  if(s.focus && !(s.projects||[]).some(p=>p.id===s.focus.id)) s.focus=null;
}
let storageBroken=false;
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ if(!storageBroken){ storageBroken=true;
    alert('Jarvis can’t save on this device.\n\nThe page was likely opened as a file (file://) or storage is blocked. It needs to be served over http/https — see the setup notes.'); } }
}
function uid(){ return Math.random().toString(36).slice(2,9); }

/* ---------- momentum / XP ---------- */
function xpCum(n){ return 60*n*n + 40*n; }
function xpLevel(xp){ let n=0; while(xpCum(n+1) <= xp) n++; return n; }
function xpProg(xp){ const l=xpLevel(xp), a=xpCum(l), b=xpCum(l+1); return {level:l, into:xp-a, need:b-a, pct:Math.max(0,Math.round((xp-a)/(b-a)*100))}; }
function xpToday(){ const t=todayISO(); return S.xpLog.filter(e=>e.d===t && e.amt>0).reduce((s,e)=>s+e.amt,0); }
let _pendingCele=null;
function award(amt, label, opts){
  if(!amt) return;
  const before=xpLevel(S.xp);
  S.xp=Math.max(0, S.xp + amt);
  if(amt>0){ S.xpLog.unshift({ts:Date.now(), d:todayISO(), amt, label}); if(S.xpLog.length>250) S.xpLog.length=250; }
  const after=xpLevel(S.xp);
  if(opts && opts.cele) _pendingCele=opts.cele;
  else if(after>before) _pendingCele={kicker:'Level up', big:'Level '+after, sub:levelBlurb(after)};
}
function levelBlurb(n){
  if(n>=15) return 'Genuinely impressive consistency.';
  if(n>=10) return 'This is a habit now.';
  if(n>=6) return 'The momentum is real.';
  if(n>=3) return 'Keep the streak alive.';
  return 'You’re rolling.';
}
function flushCele(){ if(_pendingCele){ const c=_pendingCele; _pendingCele=null; celebrate(c); } }
function celebrate(o){
  confetti();
  const ov=el('div',{class:'celebrate', onclick:()=>ov.remove()}, [ el('div',{},[
    o.kicker?el('div',{class:'kicker'}, o.kicker):null,
    el('div',{class:'big'}, o.big),
    o.sub?el('div',{class:'sub2'}, o.sub):null,
    el('div',{class:'sub2', style:'margin-top:18px;opacity:.45;font-size:.78rem'}, 'tap to continue'),
  ]) ]);
  document.body.append(ov);
  setTimeout(()=>{ if(ov.isConnected) ov.remove(); }, 6500);
}
function confetti(){
  const c=el('div',{class:'conf'}), cols=['#7aa2ff','#43c59e','#e0b453','#e0685f','#c58aff'];
  for(let i=0;i<72;i++){ const p=el('i');
    p.style.left=Math.random()*100+'vw'; p.style.background=cols[i%cols.length];
    p.style.animationDuration=(1.5+Math.random()*1.7)+'s'; p.style.animationDelay=(Math.random()*.35)+'s';
    p.style.transform=`rotate(${Math.random()*360}deg)`;
    c.append(p);
  }
  document.body.append(c);
  setTimeout(()=>c.remove(), 3900);
}

/* ---------- focus mode ---------- */
function focusActive(){ return !!(S.focus && S.focus.id && S.projects.some(p=>p.id===S.focus.id && projLive(p))); }
function focusProject(){ return focusActive() ? S.projects.find(p=>p.id===S.focus.id) : null; }
function weekMode(dow){
  const base=S.week[dow];
  if(!focusActive() || base==='project') return base;
  const rest=[0,1,2,3,4,5,6].filter(d=>S.week[d]!=='project')
    .sort((a,b)=>(S.week[a]==='off'?0:1)-(S.week[b]==='off'?0:1));
  const keep=new Set(rest.slice(0, S.focus.restPerWeek|0));
  return keep.has(dow) ? base : 'project';
}

/* ---------- dates ---------- */
function todayISO(d=new Date()){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseHM(s){ const [h,m]=(s||'0:0').split(':').map(Number); return h*60+(m||0); }
function fmtHM(mins){ mins=((mins%1440)+1440)%1440; let h=Math.floor(mins/60), m=mins%60; const ap=h<12?'AM':'PM'; let hh=h%12||12; return `${hh}:${String(m).padStart(2,'0')} ${ap}`; }
function fmtDur(min){ min=Math.max(0,Math.round(min||0)); if(min<60) return `${min} min`; const h=min/60; return (Number.isInteger(h)?h:h.toFixed(1))+` hr${h===1?'':'s'}`; }
function daysBetween(a,b){ return Math.round((Date.parse(b+'T00:00') - Date.parse(a+'T00:00'))/86400000); }
function addDays(iso,n){ const d=new Date(iso+'T00:00'); d.setDate(d.getDate()+n); return todayISO(d); }

function wakeMin(){ return S.wakeOverride ? parseHM(S.wakeOverride) : parseHM(S.workStart) - S.driveMin - S.morningMin; }
function leaveMin(){ return parseHM(S.workStart) - S.driveMin; }
function asleepMin(){ return wakeMin() - S.sleepGoalH*60; }
function windDownMin(){ return asleepMin() - 45; }

/* ---------- checks / counters ---------- */
let justTapId=null;
function dayChecks(iso){ return S.checks[iso] || (S.checks[iso]={}); }
function isDone(iso,id){ return !!dayChecks(iso)[id]; }
function routineById(id){ return S.routines.find(r=>r.id===id); }
function checkXp(r){ return r.priority==='must'?12 : r.priority==='low'?6 : 10; }
function awardForToggle(id, on){
  let amt=0, label='';
  const r=routineById(id);
  if(r){ amt=checkXp(r); label=r.name; }
  else if(id.indexOf('task:')===0){ amt=15; const t=S.tasks.find(x=>'task:'+x.id===id); label=t?t.text:'Task'; }
  else if(id==='focus'){ amt=15; label='Tonight’s focus'; }
  else return;
  award(on?amt:-amt, label);
}
function toggle(iso,id){
  const d=dayChecks(iso); const on=!d[id];
  on ? d[id]=true : delete d[id];
  justTapId=id;
  awardForToggle(id, on);
  if(on) checkDayCleared(iso);
  prune(); save(); render(); flushCele();
}
function counterVal(id,iso){ return (S.counters[id]&&S.counters[id][iso])||0; }
function counterSet(id,iso,n){
  const before=counterVal(id,iso); n=Math.max(0,n);
  (S.counters[id]||(S.counters[id]={}))[iso]=n;
  const r=routineById(id), goal=r?(r.goal||1):1;
  if(before<goal && n>=goal){ award(10, r?r.name:'Water'); checkDayCleared(iso); }
  else if(before>=goal && n<goal) award(-10, r?r.name:'Water');
  save(); render(); flushCele();
}
function ringStatus(iso){
  const dow=new Date(iso+'T00:00').getDay(), mode=weekMode(dow);
  const nowMin=new Date().getHours()*60+new Date().getMinutes();
  const out = nowMin>=12*60 && eveningCommitment(iso);
  const due=S.routines.filter(r=>routineDue(r,iso,mode) && r.slot!=='winddown' && r.priority!=='low');
  const fp=(mode==='project' && !out) ? pickFocus(iso) : null;
  const items=[ ...due.map(r=>({done:routineComplete(r,iso)})), ...(fp?[{done:isDone(iso,'focus')}]:[]) ];
  return {items, allDone: items.length>0 && items.every(i=>i.done)};
}
function checkDayCleared(iso){
  if(iso!==todayISO() || dayChecks(iso).__cleared) return;
  if(ringStatus(iso).allDone){
    dayChecks(iso).__cleared=true;
    award(50, 'Day cleared', {cele:{kicker:'Nice', big:'Day cleared', sub:'Everything that mattered today — done. Go rest.'}});
  }
}
function prune(){
  const cut=addDays(todayISO(),-95);
  for(const k in S.checks) if(k<cut) delete S.checks[k];
  for(const id in S.counters) for(const k in S.counters[id]) if(k<cut) delete S.counters[id][k];
  S.events = S.events.filter(e=> e.date >= addDays(todayISO(),-2));
}

/* ---------- routines ---------- */
function routineDue(r, iso, mode){
  if(r.priority==='low' && focusActive()) return false;   // low-priority routines pause during Focus
  if(r.skipRest && (mode==='rest'||mode==='off')) return false;
  const c=r.cadence||{type:'daily'};
  const d=new Date(iso+'T00:00'), dow=d.getDay();
  switch(c.type){
    case 'daily': return true;
    case 'everyN': { const n=Math.max(1,c.n||1); return ((((daysBetween(c.anchor||iso,iso))%n)+n)%n)===0; }
    case 'weekdays': return (c.days||[]).includes(dow);
    case 'weeklyN': { const n=Math.max(1,c.n||1); if(!(c.days||[]).includes(dow)) return false;
      return (((Math.floor(daysBetween(c.anchor||iso,iso)/7)%n)+n)%n)===0; }
    case 'monthly': { const day=Math.min(31,Math.max(1,c.date||1));
      const dim=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
      return d.getDate()===day || (day>dim && d.getDate()===dim); }
    default: return true;
  }
}
function routineComplete(r, iso){
  if(r.kind==='counter') return counterVal(r.id,iso) >= (r.goal||1);
  return isDone(iso,r.id);
}

/* ---------- skills ---------- */
const LEVELS=[0,1,3,7,14,25,45,75,120,180,260,360];   // cumulative hours per level
function skillMinutes(k){ return (k.sessions||[]).reduce((t,s)=>t+(+s.min||0),0); }
function skillLevel(k){ const h=skillMinutes(k)/60; let lv=0; for(let i=0;i<LEVELS.length;i++){ if(h>=LEVELS[i]) lv=i; } return lv; }
function skillNext(k){ const h=skillMinutes(k)/60, lv=skillLevel(k); const nx=LEVELS[lv+1]; return nx==null?null:{lv:lv+1, need:nx, have:h, pct:Math.min(100, Math.round((h-LEVELS[lv])/(nx-LEVELS[lv])*100))}; }
function skillStreak(k){
  const days=new Set((k.sessions||[]).map(s=>s.date));
  let n=0; for(let i=0;i<400;i++){ const iso=addDays(todayISO(),-i);
    if(days.has(iso)) n++; else if(i>0) break; else continue; }
  return n;
}
function skillLastPracticed(k){ const ds=(k.sessions||[]).map(s=>s.date).sort(); return ds[ds.length-1]||''; }
function logSkill(k, min, iso){
  k.sessions=k.sessions||[];
  const m=Math.max(1,Math.round(min||10)), before=skillLevel(k);
  k.sessions.push({date:iso||todayISO(), min:m});
  award(m, 'Practiced '+k.name);
  if(skillLevel(k)>before) _pendingCele={kicker:k.name, big:'Skill Level '+skillLevel(k), sub:'Getting good at this.'};
  save(); render(); flushCele();
}
function logSkillSheet(iso, routineId){
  if(!S.skills.length){
    sheet('Add a skill',[ field('What skill?', `<input id="sk_n" placeholder="Drawing">`) ], ()=>{
      const n=$('#sk_n').value.trim(); if(!n) return false;
      const k={id:uid(), name:n, createdAt:todayISO(), sessions:[]}; S.skills.push(k);
      save(); logSkillSheet(iso, routineId); return true;
    });
    return;
  }
  let pick=S.skills[0].id, mins=10;
  sheet('Log skill practice',[
    labeled('Which skill', segmented(S.skills.map(k=>[k.id,k.name]), pick, v=>pick=v)),
    field('Minutes', numInput(10, v=>mins=v)),
  ], ()=>{
    const k=S.skills.find(x=>x.id===pick); if(!k) return false;
    if(routineId){ dayChecks(iso)[routineId]=true; justTapId=routineId; }
    logSkill(k, mins, iso);
    if(routineId) checkDayCleared(iso);
    save(); render(); flushCele(); return true;
  });
}
function routineStreak(r){
  let n=0;
  for(let i=0;i<160;i++){
    const d=new Date(); d.setDate(d.getDate()-i);
    const iso=todayISO(d), mode=weekMode(d.getDay());
    if(!routineDue(r,iso,mode)) continue;
    if(i===0 && !routineComplete(r,iso)) continue;
    if(routineComplete(r,iso)) n++; else break;
  }
  return n;
}
function cadenceLabel(c){
  c=c||{type:'daily'};
  if(c.type==='daily') return 'every day';
  if(c.type==='everyN') return `every ${c.n||1} days`;
  if(c.type==='weekdays') return (c.days||[]).length===7?'every day':(c.days||[]).slice().sort().map(d=>WD[d].slice(0,3)).join(' ');
  if(c.type==='weeklyN') return `every ${c.n||1} wks · ${(c.days||[]).map(d=>WD[d].slice(0,3)).join(' ')}`;
  if(c.type==='monthly') return `day ${c.date||1} monthly`;
  return '';
}

/* ---------- events ---------- */
function eventsOn(iso){ return S.events.filter(e=>e.date===iso).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99')); }
function eveningCommitment(iso){ return eventsOn(iso).some(e=> !e.time || parseHM(e.time) >= 16*60); }

/* ---------- projects / scheduler ---------- */
// Every project is a to-do list, optionally split into ordered Parts (each its own list).
// curr() is the list to work on now: the first unfinished Part, or the project itself.
function hasParts(p){ return p.parts && p.parts.length>0; }
function curr(p){
  if(hasParts(p)) return p.parts.find(s=>!s.complete) || p.parts[p.parts.length-1];
  return p;
}
function deadlineOf(p){ return curr(p).deadline || p.deadline || ''; }
function pDone(p){ return (curr(p).subs||[]).filter(s=>s.done).length; }
function pTotal(p){ return (curr(p).subs||[]).length; }
function pRemaining(p){ return Math.max(0, pTotal(p) - pDone(p)); }
function projRemaining(p){ return hasParts(p) ? p.parts.filter(s=>!s.complete).reduce((t,s)=>t+(s.subs||[]).filter(x=>!x.done).length,0) : pRemaining(p); }
function projTotal(p){ return hasParts(p) ? p.parts.reduce((t,s)=>t+(s.subs||[]).length,0) : pTotal(p); }
function projLive(p){ return !p.archived && (hasParts(p) ? p.parts.some(s=>!s.complete) : pRemaining(p)>0); }
function unit(p,n){ return Math.abs(n)===1 ? 'task' : 'tasks'; }
function perSessionOf(p){ return Math.max(1, +p.perSession || 2); }
function minPerSessionOf(p){ return +p.minPerSession || 45; }
function liveProjects(){ return S.projects.filter(projLive); }
function focusNightsPerWeek(){ return [0,1,2,3,4,5,6].filter(d=>weekMode(d)==='project').length || 3; }

function score(o, iso, fnpw){
  const per=Math.max(1,o.per||1);
  let daysLeft=null, pressure=0.45, fnl=null, need=null;
  if(o.deadline){
    daysLeft=daysBetween(iso,o.deadline);
    if(daysLeft<=0) pressure=99;
    else { fnl=Math.max(1,Math.round(daysLeft*fnpw/7)); need=o.remaining/fnl; pressure=need/per; }
  }
  const tier = (daysLeft!=null&&daysLeft<=0)?3 : pressure>1.15?2 : 1;
  return {daysLeft,pressure,fnl,need,per,tier};
}
function cmp(a,b,iso,fnpw){
  const sa=score(a,iso,fnpw), sb=score(b,iso,fnpw);
  if(sa.tier!==sb.tier) return sb.tier-sa.tier;
  const pa=prW(a.priority), pb=prW(b.priority);
  if(pa!==pb) return pb-pa;
  if(Math.abs(sa.pressure-sb.pressure)>1e-6) return sb.pressure-sa.pressure;
  return (a.lastWorked||'').localeCompare(b.lastWorked||'');
}
function amountFor(s){
  let amt=s.per;
  if(s.need!=null) amt=Math.max(s.per, Math.round(s.need));
  return Math.max(1, Math.min(amt, s.per*2));   // never suggest more than 2 sessions' worth in one night
}
// remaining work as an ordered list of parts ({name, remaining, deadline})
function workParts(p){
  if(hasParts(p)) return p.parts.filter(s=>!s.complete).map(s=>({
    name:s.name, remaining:(s.subs||[]).filter(x=>!x.done).length, deadline:s.deadline||p.deadline||'' }));
  return [{name:'', remaining:pRemaining(p), deadline:p.deadline||''}];
}
function pickFocus(iso){
  const cands=liveProjects();
  if(!cands.length) return null;
  const fnpw=focusNightsPerWeek();
  const fpj=focusProject();
  const base = fpj ? [fpj] : cands;
  const pool=base.map(p=>({p, deadline:deadlineOf(p), remaining:pRemaining(p), per:perSessionOf(p), priority:p.priority, lastWorked:p.lastWorked||''}));
  pool.sort((a,b)=>cmp(a,b,iso,fnpw));
  const win=pool[0], s=score(win,iso,fnpw);
  const amount=Math.min(win.remaining, amountFor(s));
  const st = hasParts(win.p) ? curr(win.p) : null;
  let status;
  if(s.daysLeft!=null&&s.daysLeft<=0) status={cls:'over', txt:'past its deadline — do what you can'};
  else if(!win.deadline) status={cls:'', txt:`steady pace · ${win.remaining} ${unit(win.p,win.remaining)} left · add a deadline for real pacing`};
  else if(s.pressure>1.25) status={cls:'soon', txt:`behind — ${amount} ${unit(win.p,amount)} tonight to catch up · ${s.fnl} focus nights to deadline`};
  else if(s.pressure<0.7) status={cls:'ok', txt:`ahead — ${win.remaining} left over ~${s.fnl} focus nights`};
  else status={cls:'', txt:`on pace — ${win.remaining} ${unit(win.p,win.remaining)} over ~${s.fnl} focus nights`};
  return {project:win.p, part:st, amount, status, feas:feasibility(win.p)};
}

let _simKey='', _simCache=null;
function simFinishes(){
  const key=JSON.stringify(S.projects.map(p=>[p.id,p.archived,p.priority,p.pinned,p.perSession,workParts(p)]))
    +JSON.stringify(S.week)+JSON.stringify(S.events)+JSON.stringify(S.focus||0);
  if(_simKey===key) return _simCache;
  _simKey=key; _simCache=buildProjection(150).finishes;
  return _simCache;
}
function feasibility(p){
  if(!deadlineOf(p)) return null;
  const f=(simFinishes()||[]).find(x=>x.id===p.id);
  if(!f) return null;
  const target = f.partFinish || f.finish;         // active part's projected completion
  const dl = deadlineOf(p);
  const ok = target && target<=dl;
  return {ok, finish:target, late: target? Math.max(0, daysBetween(dl, target)) : null, parted:hasParts(p), partName: hasParts(p)?curr(p).name:'' };
}

function buildProjection(days){
  const fnpw=focusNightsPerWeek();
  const fpid = focusProject() ? S.focus.id : null;
  const sim=liveProjects().map(p=>({
    p, parts:workParts(p), si:0, per:perSessionOf(p), minPer:minPerSessionOf(p),
    priority:p.priority, focus:p.id===fpid, lastWorked:p.lastWorked||'', finish:null, partFinish:null
  }));
  const left=s=>s.parts.slice(s.si).reduce((t,x)=>t+Math.max(0,x.remaining),0);
  const out=[];
  for(let i=0;i<days;i++){
    const iso=addDays(todayISO(), i);
    const dow=new Date(iso+'T00:00').getDay(), mode=weekMode(dow);
    const evs=eventsOn(iso);
    const blocked=evs.some(e=>!e.time||parseHM(e.time)>=16*60);
    const day={iso, dow, mode, events:evs.map(e=>e.title), focus:null};
    if(mode==='project' && !blocked){
      const active=sim.filter(s=> s.si<s.parts.length && left(s)>0);
      const fp=active.filter(s=>s.focus);
      const pool=(fp.length?fp:active);
      if(pool.length){
        pool.forEach(s=>{ s._o={deadline:s.parts[s.si].deadline, remaining:s.parts[s.si].remaining, per:s.per, priority:s.priority, lastWorked:s.lastWorked}; });
        pool.sort((a,b)=>cmp(a._o,b._o,iso,fnpw));
        const w=pool[0], sc=score(w._o,iso,fnpw);
        const amt=Math.max(1, Math.min(w._o.remaining, amountFor(sc)));
        w.parts[w.si].remaining-=amt; w.lastWorked=iso;
        let doneNote='';
        if(w.parts[w.si].remaining<=0){
          if(w.si===0 && !w.partFinish) w.partFinish=iso;
          const finishedPart=w.parts[w.si].name; w.si++;
          if(w.si>=w.parts.length){ if(!w.finish) w.finish=iso; doneNote=' — done ✓'; }
          else if(finishedPart) doneNote=` — “${finishedPart}” done`;
        }
        day.focus={name:w.p.name, part:(hasParts(w.p)&&w.parts[Math.min(w.si,w.parts.length-1)])?w.parts[Math.min(w.si,w.parts.length-1)].name:'',
          amount:amt, unit:unit(w.p,amt), note:doneNote, mins:w.minPer*(amt/Math.max(1,w.per))};
      }
    }
    out.push(day);
  }
  const finishes=sim.map(s=>({id:s.p.id, name:s.p.name, deadline:s.parts[0]?s.parts[0].deadline:'', finish:s.finish, partFinish:s.partFinish, remaining:left(s)}));
  return {out, finishes};
}

/* ===== TODAY ===== */
function viewToday(app){
  const iso=todayISO(), now=new Date(), nowMin=now.getHours()*60+now.getMinutes();

  hero.append(clk);
  app.append(hero);

  // momentum bar

  const mo=el('div',{class:'mo'});
  mo.append(el('span',{class:'chip2 xp', onclick:()=>go('you')}, `⭐ Lv ${pg.level}`));
  if(stk>1) mo.append(el('span',{class:'chip2 streak'}, `\u{1f525} ${stk}`));
  if(today>0) mo.append(el('span',{class:'chip2'}, `+${today} today`));
  mo.append(el('div',{class:'xpbar'},[ el('i',{style:`width:${pg.pct}%`}) ]));
  app.append(mo);

  // focus mode banner
  const fpj=focusProject();
  if(fpj){
    const rem=projRemaining(fpj), tot=projTotal(fpj);
    const f=feasibility(fpj);
    const b=el('div',{class:'focusbanner', onclick:()=>go('projects')});
    b.append(el('div',{class:'ttl'}, [ '\u{1f3af} Focus: '+fpj.name ]));
    b.append(el('div',{class:'bar', style:'margin-top:8px'},[ el('i',{style:`width:${tot?Math.round((tot-rem)/tot*100):0}%`}) ]));
    b.append(el('div',{class:'eta'}, `${tot-rem} of ${tot} ${unit(fpj,tot)}${f&&f.finish?` · on track for ${dstr(f.finish)}`:''} · ${S.focus.restPerWeek} rest ${S.focus.restPerWeek===1?'night':'nights'}/wk`));
    b.append(el('button',{class:'btn ghost sm', style:'margin-top:8px', onclick:e=>{ e.stopPropagation(); S.focus=null; save(); render(); }},'End focus'));
    app.append(b);
  }

  const evs=eventsOn(iso);
  const out = evening && eveningCommitment(iso);
  if(evs.length){
    const ec=el('div',{class:'card', style:'border-color:var(--accent)'});
    ec.append(el('div',{class:'faint tiny', style:'margin-bottom:6px'}, out?'You’re out tonight':'On your calendar today'));
    evs.forEach(e=> ec.append(el('div',{style:'font-weight:600;margin:2px 0'}, (e.time?fmtHM(parseHM(e.time))+'  ':'')+e.title)));
    if(out) ec.append(el('div',{class:'muted tiny', style:'margin-top:6px'},'Focus block is off tonight — just hit the must-do routines when you’re back, and protect the bedtime.'));
    app.append(ec);
  }

  const due = S.routines.filter(r=>routineDue(r,iso,mode));
  const bySlot = s => due.filter(r=>r.slot===s).sort((a,b)=>prW(b.priority)-prW(a.priority));

  let fp=null;
  if(mode==='project' && !out) fp=pickFocus(iso);

  // progress: must/normal non-winddown routines + focus
  const ringItems=[
    ...due.filter(r=>r.slot!=='winddown' && r.priority!=='low'),
    ...(fp?[{_focus:true}]:[]),
  ];
  const ringDone = ringItems.filter(it=> it._focus ? isDone(iso,'focus') : routineComplete(it,iso)).length;
  const pct = ringItems.length ? Math.round(ringDone/ringItems.length*100) : 0;
  const ring=el('div',{class:'ring'+(pct===100&&justTapId?' cleared':'')}); ring.style.setProperty('--p',pct); ring.append(el('span',{},`${pct}%`));
  app.append(el('div',{class:'prog'},[ ring, el('div',{},[
    el('div',{},`${ringDone} of ${ringItems.length} done`),
    el('div',{class:'faint tiny'}, pct===100?'Day cleared. Go rest.':'One at a time.'),
  ])]));

  if(fp) app.append(autoFocusCard(fp, iso));
  else if(mode==='project' && !out) app.append(el('div',{class:'card'},[
    el('div',{style:'font-weight:650'},'Focus night — nothing queued'),
    el('div',{class:'muted tiny', style:'margin:6px 0 10px'},'No projects with work left.'),
    el('button',{class:'btn primary sm', onclick:()=>go('projects')},'Projects'),
  ]));
  else if(mode==='rest') app.append(section('Tonight',[noteRow('Rest night — a show or nothing. On the plan on purpose.')]));
  else if(mode==='off') app.append(section('Tonight',[noteRow('Night off. Go do something fun and don’t log it.')]));

  // tasks
  const taskItems = S.tasks.filter(t=>!t.done && (t.due && t.due<=iso || (!t.due && t.priority==='must')));
  if(taskItems.length) app.append(section('Tasks', taskItems
    .sort((a,b)=> prW(b.priority)-prW(a.priority) || (a.due||'~').localeCompare(b.due||'~'))
    .map(t=>{
      const over = t.due && t.due<iso;
      return taskRow(iso,{id:'task:'+t.id, t:t.text, d: over?`overdue ${daysBetween(t.due,iso)}d`:(t.due?'':'no date'), prio:t.priority, _task:t});
    })));

  const morn=bySlot('morning');
  if(morn.length) app.append(section('Morning', morn.map(r=>routineRow(iso,r))));

  const evenRows=bySlot('evening').map(r=>routineRow(iso,r));
  app.append(section(mode==='off'||mode==='rest'?'Still do':'This evening', evenRows));

  const wd=el('div',{class:'sec'});
  wd.append(el('h2',{},[ 'Wind-down', el('span',{class:'hint'}, bySlot('winddown').length>1?'pick what fits':'') ]));
  bySlot('winddown').forEach(r=> wd.append(routineRow(iso,r)));
  wd.append(noteRow(`Then: shower, in bed by ${fmtHM(asleepMin())}. Phone on the charger across the room.`));
  app.append(wd);
}

function pill(html, alert=false){ return el('span',{class:'pill'+(alert?' alert':''), html}); }
function section(title, rows){
  const s=el('div',{class:'sec'}); s.append(el('h2',{}, title));
  rows.forEach(r=>s.append(r));
  if(!rows.length) s.append(el('div',{class:'empty tiny'},'Nothing here.'));
  return s;
}
function noteRow(txt){ return el('div',{class:'row note'}, txt); }

function routineRow(iso, r){
  if(r.kind==='counter') return counterRow(iso,r);
  const done=isDone(iso,r.id);
  const now=new Date(); const nowMin=now.getHours()*60+now.getMinutes();
  const locked = r.lock && todayISO()===iso && nowMin < parseHM(r.lock);
  const row=el('div',{class:'row tap'+(done?' done':'')+(locked?' locked':'')});
  row.append(el('div',{class:'box'+(justTapId===r.id?' pop':''), html:CHECK}));
  const tx=el('div',{class:'tx'});
  tx.append(el('div',{class:'t'}, r.name));
  if(r.hint) tx.append(el('div',{class:'d'}, r.hint));
  row.append(tx);
  const st=routineStreak(r);
  if(st>1) row.append(el('div',{class:'streak'}, `\u{1f525} ${st}`));
  else if(locked) row.append(el('div',{class:'rt'}, `after ${fmtHM(parseHM(r.lock))}`));
  else if(r.kind==='skill' && !done) row.append(el('div',{class:'rt'}, 'log →'));
  row.addEventListener('click',()=>{
    if(locked && !done) return;
    if(r.kind==='skill' && !done){ return logSkillSheet(iso, r.id); }
    toggle(iso, r.id);
  });
  return row;
}
function counterRow(iso, r){
  const n=counterVal(r.id,iso), goal=r.goal||1, hit=n>=goal;
  const row=el('div',{class:'row'+(hit?' done':'')});
  row.append(el('div',{class:'box', html:CHECK}));
  const tx=el('div',{class:'tx'});
  tx.append(el('div',{class:'t'}, r.name));
  tx.append(el('div',{class:'d'}, `${n} of ${goal}${r.oz?` · ${n*r.oz} oz`:''}${hit?' — done':''}`));
  row.append(tx);
  row.append(el('div',{class:'inline'},[
    el('button',{class:'btn sm', style:'padding:6px 12px', onclick:()=>counterSet(r.id,iso,n-1)},'−'),
    el('button',{class:'btn sm primary', style:'padding:6px 12px', onclick:()=>counterSet(r.id,iso,n+1)},'+'),
  ]));
  return row;
}
function taskRow(iso, r){
  const done=isDone(iso,r.id);
  const row=el('div',{class:'row tap'+(done?' done':'')});
  row.append(el('div',{class:'box'+(justTapId===r.id?' pop':''), html:CHECK}));
  const tx=el('div',{class:'tx'});
  tx.append(el('div',{class:'t'}, r.t));
  if(r.d) tx.append(el('div',{class:'d'}, r.d));
  row.append(tx);
  if(r.prio && r.prio!=='normal') row.append(el('div',{class:'dot '+r.prio}));
  row.addEventListener('click',()=>{ if(r._task) r._task.done=!done; toggle(iso,r.id); });
  return row;
}

function afterProgress(p, iso){
  const c=curr(p);
  if(hasParts(p) && c!==p && (c.subs||[]).every(x=>x.done) && !c.complete){
    c.complete=true;
    const dn=p.parts.filter(s=>s.complete).length;
    if(dn<p.parts.length) award(250,'Part done: '+c.name, {cele:{kicker:'Part complete', big:'“'+c.name+'” done', sub:`${p.name} · ${dn} of ${p.parts.length} parts`}});
  }
}
function logWork(p, amount, iso){
  const c=curr(p), wasLive=projLive(p);
  let k=amount; for(const s of c.subs){ if(k<=0)break; if(!s.done){ s.done=true; k--; } }
  p.lastWorked=iso;
  award(Math.round(minPerSessionOf(p)*(amount/perSessionOf(p))), p.name+' — session');
  afterProgress(p, iso);
  if(wasLive && !projLive(p)){
    p.archived=true;
    if(S.focus && S.focus.id===p.id) S.focus=null;
    award(500,'Project done: '+p.name, {cele:{kicker:'Project complete', big:p.name, sub:'Done. Off your plate for good.'}});
  }
  checkDayCleared(iso);
  save(); render(); flushCele();
}
function autoFocusCard(fp, iso){
  const p=fp.project, st=fp.part, cw=curr(p);
  const c=el('div',{class:'card focuscard'});
  const done=isDone(iso,'focus');
  const head=el('div',{class:'row tap'+(done?' done':''), style:'border:0;background:none;padding:4px 0;margin:0'});
  head.append(el('div',{class:'box', html:CHECK}));
  head.append(el('div',{class:'tx'},[
    el('div',{class:'t'}, p.name),
    el('div',{class:'d'}, `${st&&st.name?st.name+' · ':''}${fp.amount} ${unit(p,fp.amount)} tonight · ~${fmtDur(minPerSessionOf(p) * (fp.amount/perSessionOf(p)))}`),
  ]));
  head.addEventListener('click',()=>toggle(iso,'focus'));
  c.append(head);

  const meta=el('div',{class:'inline', style:'gap:8px;margin:8px 0 0;flex-wrap:wrap'});
  const dl=deadlineTag(deadlineOf(p)); if(dl) meta.append(dl);
  if(S.focus && S.focus.id===p.id) meta.append(el('span',{class:'badge ok'},'\u{1f3af} focus'));
  if(p.priority!=='normal') meta.append(el('span',{class:'badge'}, p.priority==='must'?'must-do':'low priority'));
  if(meta.children.length) c.append(meta);
  c.append(el('div',{class:'muted tiny', style:'margin-top:6px'}, fp.status.txt));
  if(fp.feas && !fp.feas.ok) c.append(el('div',{class:'tiny', style:'margin-top:4px;color:var(--bad)'},
    `⚠ ${fp.feas.finish?`${fp.feas.parted&&fp.feas.partName?`“${fp.feas.partName}” `:''}won’t make its deadline — projected ${dstr(fp.feas.finish)}`:'won’t finish at this pace'}. Do more per session, add focus nights, or move the date.`));

  if(hasParts(p)) c.append(partStrip(p));
  c.append(el('div',{class:'bar'},[ el('i',{style:`width:${pTotal(p)?Math.round(pDone(p)/pTotal(p)*100):0}%`}) ]));
  c.append(el('div',{class:'faint tiny', style:'margin-top:4px'}, `${pDone(p)} of ${pTotal(p)} done${st&&st.name?` in “${st.name}”`:''}`));

  const list=el('div',{class:'sub-list'});
  cw.subs.slice().sort((a,b)=>a.done-b.done).forEach(s=>{
    const sr=el('div',{class:'sub'+(s.done?' done':'')});
    sr.append(el('div',{class:'box', html:CHECK}));
    sr.append(el('div',{class:'s'}, s.text));
    sr.addEventListener('click',()=>{
      const wasLive=projLive(p);
      s.done=!s.done; p.lastWorked=iso;
      award(s.done?50:-50, s.text);
      afterProgress(p, iso);
      if(wasLive&&!projLive(p)){ p.archived=true; if(S.focus&&S.focus.id===p.id)S.focus=null;
        award(500,'Project done: '+p.name,{cele:{kicker:'Project complete', big:p.name, sub:'Done. Off your plate for good.'}}); }
      checkDayCleared(iso); save(); render(); flushCele();
    });
    list.append(sr);
  });
  c.append(list);

  c.append(el('button',{class:'btn primary sm block', style:'margin-top:12px',
    onclick:()=>{ dayChecks(iso).focus=true; justTapId='focus'; logWork(p, fp.amount, iso); }},
    `Log tonight’s ${fp.amount} ${unit(p,fp.amount)} done`));
  return c;
}
function partStrip(p){
  const w=el('div',{class:'stagestrip'});
  const parts=p.parts, ci=parts.findIndex(s=>s===curr(p));
  const doneN=parts.filter(s=>s.complete).length;
  let shown=parts;
  if(parts.length>6){
    const from=Math.max(0, Math.min(ci-1, parts.length-5));
    shown=parts.slice(from, from+5);
    if(from>0) w.append(el('div',{class:'stg done'}, [ el('span',{class:'stgdot'},'✓'), el('span',{}, `${from} done`) ]));
  }
  shown.forEach(s=>{
    const state = s.complete ? 'done' : (s===curr(p) ? 'active' : 'up');
    const dn=(s.subs||[]).filter(x=>x.done).length, tt=(s.subs||[]).length;
    w.append(el('div',{class:'stg '+state}, [
      el('span',{class:'stgdot'}, s.complete?'✓':(state==='active'?'▸':'')),
      el('span',{style:'flex:1'}, s.name),
      el('span',{class:'tiny'}, s.complete?'':`${dn}/${tt}`),
    ]));
  });
  const tailFrom = shown.length && parts.indexOf(shown[shown.length-1])+1;
  if(tailFrom && tailFrom<parts.length) w.append(el('div',{class:'stg up'}, [ el('span',{class:'stgdot'},''), el('span',{}, `+${parts.length-tailFrom} more`) ]));
  return w;
}
function deadlineTag(d){
  if(!d) return null;
  const n=daysBetween(todayISO(), d);
  let cls='deadline', txt;
  if(n<0){ cls+=' over'; txt=`${-n}d overdue`; }
  else if(n===0){ cls+=' over'; txt='due today'; }
  else if(n<=10){ cls+=' soon'; txt=`${n}d left`; }
  else txt=`due ${new Date(d+'T00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})} · ${n}d`;
  return el('span',{class:cls}, txt);
}

function viewProjects(app){
  app.append(el('header',{class:'hero'},[ el('div',{class:'greet'},'Projects'), el('div',{class:'sub'},'Things with a finish line. Jarvis assigns them to focus nights by priority, deadline, and pace.') ]));
  app.append(el('button',{class:'btn primary block', style:'margin:6px 0 4px', onclick:()=>editProject()}, '+ New project'));
  const iso=todayISO(), fpNext=pickFocus(iso);
  const live=S.projects.filter(p=>!p.archived), done=S.projects.filter(p=>p.archived);
  if(!live.length) app.append(el('div',{class:'empty'},'No projects.'));
  const fid=S.focus&&S.focus.id;
  live.sort((a,b)=>(b.id===fid?1:0)-(a.id===fid?1:0) || prW(b.priority)-prW(a.priority) || (deadlineOf(a)||'~').localeCompare(deadlineOf(b)||'~'));
  for(const p of live) app.append(projectCard(p, iso, fpNext&&fpNext.project===p));
  if(done.length){
    app.append(el('div',{class:'divider'}));
    app.append(el('h2',{},`Done (${done.length})`));
    for(const p of done) app.append(projectCard(p, iso, false));
  }
}
function projectCard(p, iso, isNext){
  const isFocus = S.focus && S.focus.id===p.id;
  const c=el('div',{class:'card'+(isNext||isFocus?' focuscard':'')});
  const feas=feasibility(p);
  c.append(el('h3',{}, (isFocus?'\u{1f3af} ':'')+p.name));
  const tags=el('div',{class:'inline', style:'gap:6px;margin-top:5px;flex-wrap:wrap'});
  const dl=deadlineTag(deadlineOf(p)); if(dl) tags.append(dl);
  if(p.priority!=='normal') tags.append(el('span',{class:'badge'}, p.priority==='must'?'must-do':'low'));
  if(isFocus) tags.append(el('span',{class:'badge ok'},'focus'));
  else if(isNext) tags.append(el('span',{class:'badge ok'},'up next'));
  if(feas && !feas.ok) tags.append(el('span',{class:'badge over'},'behind deadline'));
  if(tags.children.length) c.append(tags);
  if(p.notes) c.append(el('div',{class:'muted tiny', style:'margin-top:8px;white-space:pre-wrap'}, p.notes));
  const pt=projTotal(p), pdAll=pt-projRemaining(p);
  c.append(el('div',{class:'bar'},[ el('i',{style:`width:${pt?Math.round(pdAll/pt*100):0}%`}) ]));
  if(hasParts(p)){
    c.append(partStrip(p));
    const dn=p.parts.filter(s=>s.complete).length;
    c.append(el('div',{class:'faint tiny', style:'margin-top:6px'}, `${dn} / ${p.parts.length} parts done${!p.archived?` · on “${curr(p).name}”`:''}`+(feas&&feas.finish?` · projected ${dstr(feas.finish)}`:'')));
  } else {
    c.append(el('div',{class:'faint tiny', style:'margin-top:4px'}, `${pDone(p)} / ${pTotal(p)} done`+(feas&&feas.finish?` · projected ${dstr(feas.finish)}`:'')));
  }
  const act=el('div',{class:'row-actions'});
  if(!p.archived){
    act.append(el('button',{class:'btn sm'+(isFocus?' primary':''), onclick:()=> isFocus ? (S.focus=null, save(), render()) : chooseFocus(p) }, isFocus?'\u{1f3af} Focus ✓':'\u{1f3af} Focus'));
    act.append(el('button',{class:'btn sm', onclick:()=>editProject(p)},'Edit'));
    act.append(el('button',{class:'btn sm', onclick:()=>{ p.archived=true; if(S.focus&&S.focus.id===p.id)S.focus=null; save(); render(); }},'Archive'));
  } else {
    act.append(el('button',{class:'btn sm', onclick:()=>{ p.archived=false; save(); render(); }},'Reopen'));
    act.append(armDelete('Delete', ()=>{ S.projects=S.projects.filter(x=>x!==p); save(); render(); }));
  }
  c.append(act);
  return c;
}
function bestStreak(){ return S.routines.reduce((m,r)=>Math.max(m, routineStreak(r)), 0); }
function chooseFocus(p){
  let lvl=2;
  sheet('\u{1f3af} Focus: '+p.name, [
    field('', el('p',{class:'muted', style:'margin:2px 0 4px'}, 'Everything bends toward finishing this. Low-priority routines pause. Rest nights become work nights, except the ones you keep below.')),
    labeled('Keep how many rest nights a week?', segmented([['2','2 · balanced'],['1','1 · pushing'],['0','0 · all in']], String(lvl), v=>lvl=+v)),
  ], ()=>{
    S.focus={id:p.id, restPerWeek:lvl};
    save(); render();
    _pendingCele={kicker:'Focus on', big:p.name, sub:'Let’s get this done.'};
    flushCele();
    return true;
  });
}
function todosToText(subs){ return (subs||[]).map(s=>(s.done?'x ':'')+s.text).join('\n'); }
function textToTodos(t){ return (t||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>({text:l.replace(/^x\s+/i,''), done:/^x\s+/i.test(l)})); }

function editProject(p){
  const isNew=!p;
  p = p || {id:uid(), name:'', deadline:'', perSession:2, minPerSession:45, priority:'normal', notes:'', subs:[], parts:[], pinned:false, archived:false, lastWorked:''};
  const D={
    name:p.name, prio:p.priority, notes:p.notes||'',
    per:p.perSession||2, min:p.minPerSession||45,
    mode: hasParts(p) ? 'parts' : 'flat',
    deadline:p.deadline||'',
    flatText: todosToText(p.subs),
    tmpl:'',
    parts:(p.parts||[]).map(s=>({id:s.id, name:s.name, deadline:s.deadline||'', complete:!!s.complete, text:todosToText(s.subs), open:false})),
    genBase:'Episode', genN:9,
  };
  const bodyBox=el('div',{});
  function grab(){
    if($('#p_per')) D.per=Math.max(1,+$('#p_per').value||2);
    if($('#p_min')) D.min=Math.max(5,+$('#p_min').value||45);
    if($('#p_dl')) D.deadline=$('#p_dl').value;
    if($('#p_flat')) D.flatText=$('#p_flat').value;
    if($('#p_tmpl')) D.tmpl=$('#p_tmpl').value;
    D.parts.forEach(pt=>{ const t=document.getElementById('pt_t_'+pt.id); if(t) pt.text=t.value; });
  }
  function drawBody(){
    grab(); bodyBox.innerHTML='';
    bodyBox.append(el('div',{class:'grid2'},[
      field('To-dos per work session', `<input id="p_per" type="number" min="1" value="${D.per}">`),
      field('Minutes a session takes', `<input id="p_min" type="number" min="5" step="5" value="${D.min}">`),
    ]));
    if(D.mode==='flat'){
      bodyBox.append(field('Deadline (optional)', `<input id="p_dl" type="date" value="${D.deadline}">`));
      bodyBox.append(field('To-dos — one per line', `<textarea id="p_flat" style="min-height:120px" placeholder="Draft outline\nWrite section 1\nEdit\nPublish">${esc(D.flatText)}</textarea>`));
    } else {
      bodyBox.append(field('To-do template — copied into each new part', `<textarea id="p_tmpl" placeholder="Import footage\nSync cameras / audio\nSync video\nEdit\nExport">${esc(D.tmpl)}</textarea>`));
      const gen=el('div',{class:'stagerow', style:'margin-top:8px'});
      gen.append(el('input',{value:D.genBase, style:'flex:1', oninput:e=>D.genBase=e.target.value}));
      gen.append(el('input',{type:'number', min:'1', value:D.genN, style:'max-width:56px;text-align:center', oninput:e=>D.genN=Math.max(1,+e.target.value||1)}));
      gen.append(el('button',{class:'btn sm', onclick:()=>{
        grab();
        const tpl=textToTodos(D.tmpl);
        for(let i=1;i<=D.genN;i++) D.parts.push({id:uid(), name:`${D.genBase} ${i}`, deadline:'', complete:false, text:todosToText(tpl.map(x=>({...x}))), open:false});
        drawBody();
      }},'+ Add'));
      bodyBox.append(labeled('Quick-add numbered parts', gen));

      const list=el('div',{style:'margin-top:10px'});
      D.parts.forEach((pt,i)=>{
        const card=el('div',{class:'card', style:'margin:8px 0;padding:10px'});
        const row=el('div',{class:'stagerow'});
        row.append(el('input',{value:pt.name, placeholder:`Part ${i+1}`, style:'flex:1', oninput:e=>pt.name=e.target.value}));
        row.append(el('input',{type:'date', value:pt.deadline, style:'max-width:130px', oninput:e=>pt.deadline=e.target.value}));
        row.append(el('button',{class:'del', onclick:()=>{ grab(); D.parts.splice(i,1); drawBody(); }},'✕'));
        card.append(row);
        const cnt=textToTodos(pt.text);
        card.append(el('button',{class:'btn ghost sm', style:'margin-top:6px', onclick:()=>{ grab(); pt.open=!pt.open; drawBody(); }},
          `${pt.open?'▾':'▸'} ${cnt.filter(x=>x.done).length}/${cnt.length} to-dos${pt.complete?' · ✓ complete':''}`));
        if(pt.open) card.append(el('textarea',{id:'pt_t_'+pt.id, style:'margin-top:6px', placeholder:'Import footage\nEdit\nExport'}, pt.text));
        list.append(card);
      });
      if(!D.parts.length) list.append(el('div',{class:'empty tiny'},'No parts yet — quick-add above, or one at a time.'));
      bodyBox.append(list);
      bodyBox.append(el('button',{class:'btn sm block', onclick:()=>{ grab(); D.parts.push({id:uid(), name:'', deadline:'', complete:false, text:D.tmpl, open:true}); drawBody(); }},'+ Add one part'));
    }
  }
  drawBody();

  sheet(isNew?'New project':'Edit project', [
    field('Name', `<input id="p_name" value="${esc(D.name)}" placeholder="e.g. Edmontask S3 Live">`),
    labeled('Priority', segmented(PRIOS, D.prio, v=>D.prio=v)),
    labeled('Structure', segmented([['flat','One checklist'],['parts','Parts']], D.mode, v=>{ D.mode=v; drawBody(); })),
    bodyBox,
    field('Notes', `<textarea id="p_notes">${esc(D.notes)}</textarea>`),
  ], ()=>{
    D.name=$('#p_name').value.trim(); if(!D.name) return false;
    grab();
    p.name=D.name; p.priority=D.prio; p.perSession=D.per; p.minPerSession=D.min;
    p.notes=$('#p_notes').value.trim();
    if(D.mode==='flat'){
      p.parts=[]; p.deadline=D.deadline;
      p.subs=textToTodos(D.flatText);
      if(!p.subs.length) return false;
    } else {
      const clean=D.parts.filter(pt=>(pt.name||'').trim() || textToTodos(pt.text).length).map(pt=>{
        const subs=textToTodos(pt.text);
        return {id:pt.id||uid(), name:(pt.name||'').trim()||'Part', deadline:pt.deadline||'',
          complete: subs.length ? subs.every(x=>x.done) : !!pt.complete, subs: subs.length?subs:[{text:'Complete', done:!!pt.complete}]};
      });
      if(!clean.length) return false;
      p.parts=clean; p.subs=[];
    }
    if(isNew) S.projects.push(p);
    save(); render(); return true;
  }, isNew?null:()=>{ S.projects=S.projects.filter(x=>x!==p); if(S.focus&&S.focus.id===p.id)S.focus=null; save(); closeSheet(); render(); });
}

function viewRoutines(app){

function editRoutine(r){
  const isNew=!r;
  r = r || {id:uid(), name:'', hint:'', cadence:{type:'daily'}, slot:'evening', priority:'normal', skipRest:false, lock:'', kind:'check', goal:1, oz:0};
  const d = JSON.parse(JSON.stringify(r));
  let prio=d.priority, slot=d.slot, kind=d.kind;

  const cadBox=el('div',{});
  function drawCad(){
    cadBox.innerHTML='';
    const t=d.cadence.type;
    const typeSel=el('select',{onchange:e=>{ d.cadence={type:e.target.value, n:2, days:d.cadence.days||[new Date().getDay()], date:d.cadence.date||1, anchor:todayISO()}; drawCad(); }});
    [['daily','Every day'],['everyN','Every N days'],['weekdays','Certain weekdays'],['weeklyN','Every N weeks'],['monthly','Monthly']].forEach(([v,l])=>
      typeSel.append(el('option',{value:v, selected:v===t?'selected':null}, l)));
    cadBox.append(labeled('Repeats', typeSel));
    if(t==='everyN') cadBox.append(field('Every how many days?', numInput(d.cadence.n||2, v=>d.cadence.n=v)));
    if(t==='weeklyN') cadBox.append(field('Every how many weeks?', numInput(d.cadence.n||2, v=>d.cadence.n=v)));
    if(t==='weekdays'||t==='weeklyN') cadBox.append(labeled('On', dayChips(d.cadence.days||[], ds=>d.cadence.days=ds)));
    if(t==='monthly') cadBox.append(field('On day of month', numInput(d.cadence.date||1, v=>d.cadence.date=v)));
    if(t==='everyN'||t==='weeklyN') cadBox.append(el('div',{class:'faint tiny'},'Counts from today.'));
  }
  drawCad();

  const kindBox=el('div',{});
  function drawKind(){
    kindBox.innerHTML='';
    kindBox.append(labeled('Type', segmented([['check','Checkbox'],['counter','Counter'],['skill','Skill log']], kind, v=>{ kind=v; drawKind(); })));
    if(kind==='skill') kindBox.append(el('div',{class:'faint tiny'},'Tapping it asks which skill you practiced and for how long, and logs it on the Skills tab.'));
    if(kind==='counter') kindBox.append(el('div',{class:'grid2'},[
      field('Daily goal', numInput(d.goal||1, v=>d.goal=v)),
      field('oz each (optional)', numInput(d.oz||0, v=>d.oz=v)),
    ]));
  }
  drawKind();

  sheet(isNew?'New routine':'Edit routine', [
    field('Name', `<input id="r_name" value="${esc(d.name)}" placeholder="Stretch / Duolingo / Call mom">`),
    field('Hint (optional)', `<input id="r_hint" value="${esc(d.hint||'')}" placeholder="before dinner">`),
    labeled('Priority', segmented(PRIOS, prio, v=>prio=v)),
    labeled('When', segmented([['morning','Morning'],['evening','Evening'],['winddown','Wind-down']], slot, v=>slot=v)),
    cadBox,
    field('Not available until (optional time)', `<input id="r_lock" type="time" value="${d.lock||''}">`),
    checkboxRow('r_skip','Skip on rest & off nights', d.skipRest),
    kindBox,
  ], ()=>{
    d.name=$('#r_name').value.trim(); if(!d.name) return false;
    d.hint=$('#r_hint').value.trim();
    d.priority=prio; d.slot=slot; d.kind=kind;
    d.lock=$('#r_lock').value;
    d.skipRest=$('#r_skip').checked;
    if(d.cadence.type!=='everyN'&&d.cadence.type!=='weeklyN') delete d.cadence.anchor; else d.cadence.anchor=d.cadence.anchor||todayISO();
    Object.assign(r, d);
    if(isNew) S.routines.push(r);
    save(); render(); return true;
  }, isNew?null:()=>{ S.routines=S.routines.filter(x=>x!==r); save(); closeSheet(); render(); });
}

/* ===== PLAN ===== */
function viewPlan(app){
  const {out} = buildProjection(14);
  const finishes = simFinishes() || [];
  app.append(el('header',{class:'hero'},[ el('div',{class:'greet'},'Plan'), el('div',{class:'sub'},'How the next two weeks shake out. Recalculates when anything changes.') ]));

  // headline + 7-day strip
  const wk7=out.slice(0,7);
  const fN=wk7.filter(d=>d.mode==='project'&&d.focus).length;
  const hrs=wk7.reduce((t,d)=>t+(d.focus?d.focus.mins:0),0)/60;
  const nextFin=finishes.filter(f=>f.partFinish||f.finish).sort((a,b)=>((a.partFinish||a.finish)).localeCompare(b.partFinish||b.finish))[0];
  const hl=el('div',{class:'card hl'});
  hl.append(el('div',{class:'faint tiny'},'Next 7 days'));
  hl.append(el('div',{style:'font-weight:750;font-size:1.1rem;margin-top:2px'}, `${fN} focus night${fN===1?'':'s'} · ~${hrs<1?Math.round(hrs*60)+' min':hrs.toFixed(1)+' hrs'}`));
  if(nextFin){
    const p=S.projects.find(x=>x.id===nextFin.id);
    hl.append(el('div',{class:'muted tiny', style:'margin-top:3px'},
      `finishing next: ${nextFin.name}${p&&hasParts(p)?' · '+curr(p).name:''} — ${dstr(nextFin.partFinish||nextFin.finish)}`));
  }
  const strip=el('div',{class:'weekstrip'});
  wk7.forEach(d=>{
    const cls = (d.mode==='project'&&d.focus)?'focus' : d.mode==='project'?'open' : d.mode==='rest'?'rest':'off';
    strip.append(el('div',{class:'wk '+cls+(d.iso===todayISO()?' today':'')},[
      el('span',{}, WD1[d.dow]),
      d.events.length ? el('span',{class:'wdot'}) : null,
    ]));
  });
  hl.append(strip);
  app.append(hl);

  // agenda
  const ag=el('div',{class:'card'});
  out.forEach(d=>{
    const type = (d.mode==='project'&&d.focus)?'focus' : d.mode==='rest'?'rest' : d.mode==='off'?'off':'open';
    const row=el('div',{class:'agrow'});
    row.append(el('div',{class:'marker '+type}));
    const mid=el('div',{style:'flex:1;min-width:0'});
    mid.append(el('div',{style:'font-weight:650;font-size:.8rem;color:var(--muted)'},
      d.iso===todayISO()?'Today':new Date(d.iso+'T00:00').toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})));
    if(d.focus){
      mid.append(el('div',{style:'font-weight:600;margin-top:1px'}, d.focus.name + (d.focus.part?' · '+d.focus.part:'')));
      mid.append(el('div',{class:'faint tiny'}, `${d.focus.amount} ${d.focus.unit} · ${fmtDur(d.focus.mins)}${d.focus.note||''}`));
    } else {
      mid.append(el('div',{class:'faint', style:'margin-top:1px'}, d.mode==='rest'?'Rest night' : d.mode==='off'?'Off' : 'Focus night — open'));
    }
    d.events.forEach(ev=> mid.append(el('div',{class:'tiny', style:'color:var(--accent);margin-top:2px'}, '\u{1f4c5} '+ev)));
    row.append(mid);
    ag.append(row);
  });
  app.append(ag);

  const fin=finishes.filter(f=>f.deadline);
  if(fin.length){
    const fc=el('div',{class:'card'});
    fc.append(el('h3',{},'Deadlines'));
    fin.forEach(f=>{
      const p=S.projects.find(x=>x.id===f.id);
      const target = f.partFinish || f.finish;
      const label = (p && hasParts(p)) ? `${f.name} · ${curr(p).name}` : f.name;
      let color='var(--good)', txt;
      if(!target){ color='var(--bad)'; txt='won’t finish'; }
      else if(target>f.deadline){ color='var(--bad)'; txt=`${daysBetween(f.deadline,target)}d late`; }
      else if(daysBetween(todayISO(),f.deadline)<=7){ color='var(--warn)'; txt='done '+dstr(target); }
      else txt='done '+dstr(target);
      fc.append(el('div',{class:'weekrow'},[
        el('div',{class:'inline', style:'gap:8px;min-width:0'},[ el('span',{class:'sdot', style:`background:${color}`}), el('div',{style:'min-width:0'}, label) ]),
        el('div',{class:'tiny', style:`color:${color};white-space:nowrap`}, txt),
      ]));
    });
    app.append(fc);
  }

  app.append(el('div',{class:'divider'}));
  app.append(el('h2',{class:'hpad', style:'margin-bottom:2px'},'Setup'));

  const modes={project:'Focus night', rest:'Rest night', off:'Off'};
  const wc=el('div',{class:'card'});
  wc.append(el('h3',{},'Week shape'));
  for(let i=1;i<=6;i++) wc.append(weekRow(i,modes));
  wc.append(weekRow(0,modes));
  wc.append(el('div',{class:'faint tiny', style:'margin-top:10px'}, `${focusNightsPerWeek()} focus nights a week${focusActive()?' (Focus Mode is bumping this)':''}.`));
  app.append(wc);

  const cm=el('div',{class:'card'});
  cm.append(el('h3',{},'Commitments'));
  cm.append(el('div',{class:'faint tiny', style:'margin:6px 0 10px'},'An evening one cancels that night’s focus block.'));
  S.events.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).forEach(e=>{
    cm.append(el('div',{class:'weekrow'},[
      el('div',{},[ el('div',{}, e.title), el('div',{class:'faint tiny'}, dstr(e.date)+(e.time?' · '+fmtHM(parseHM(e.time)):'')) ]),
      el('button',{class:'del', onclick:()=>{ S.events=S.events.filter(x=>x!==e); save(); render(); }},'Remove'),
    ]));
  });
  if(!S.events.length) cm.append(el('div',{class:'empty tiny'},'Nothing booked.'));
  cm.append(el('button',{class:'btn sm block', style:'margin-top:10px', onclick:()=>addEvent()},'+ Add commitment'));
  app.append(cm);

  const tc=el('div',{class:'card'});
  tc.append(el('h3',{},'Tasks'));
  tc.append(el('div',{class:'faint tiny', style:'margin:6px 0 10px'},'One-offs. Dated or Must-do ones show on Today.'));
  S.tasks.filter(t=>!t.done).sort((a,b)=>prW(b.priority)-prW(a.priority) || (a.due||'~').localeCompare(b.due||'~')).forEach(t=>{
    tc.append(el('div',{class:'weekrow'},[
      el('div',{class:'inline', style:'gap:8px'},[ el('div',{class:'dot '+t.priority}), el('div',{},[ el('div',{}, t.text), el('div',{class:'faint tiny'}, t.due?dstr(t.due):'no date') ]) ]),
      el('div',{class:'inline'},[
        el('button',{class:'btn sm', onclick:()=>editTask(t)},'Edit'),
        el('button',{class:'del', onclick:()=>{ S.tasks=S.tasks.filter(x=>x!==t); save(); render(); }},'✕'),
      ]),
    ]));
  });
  if(!S.tasks.filter(t=>!t.done).length) tc.append(el('div',{class:'empty tiny'},'None.'));
  tc.append(el('button',{class:'btn sm block', style:'margin-top:10px', onclick:()=>editTask()},'+ Add task'));
  app.append(tc);
}

/* ---------- form helpers ---------- */
// two-tap delete (native confirm() is unreliable in installed iOS PWAs)
function armDelete(label, onConfirm, extraClass){
  const b=el('button',{class:'del'+(extraClass?' '+extraClass:'')}, label);
  let armed=false, t=null;
  b.addEventListener('click',()=>{
    if(armed){ clearTimeout(t); onConfirm(); return; }
    armed=true; b.textContent='Tap again to confirm';
    t=setTimeout(()=>{ armed=false; b.textContent=label; }, 3000);
  });
  return b;
}
function segmented(options, value, onChange){
  const wrap=el('div',{class:'seg'});
  const btns=options.map(([ov,label])=>{
    const b=el('button',{class:'seg-b'+(ov===value?' on':''), onclick:()=>{ btns.forEach(x=>x.classList.remove('on')); b.classList.add('on'); onChange(ov); }}, label);
    return b;
  });
  btns.forEach(b=>wrap.append(b));
  return wrap;
}
function dayChips(days, onChange){
  const set=new Set(days);
  const wrap=el('div',{class:'daychips'});
  WD1.forEach((l,i)=>{
    const b=el('button',{class:set.has(i)?'on':'', onclick:()=>{
      if(set.has(i)){ set.delete(i); b.classList.remove('on'); } else { set.add(i); b.classList.add('on'); }
      onChange([...set].sort((x,y)=>x-y));
    }}, l);
    wrap.append(b);
  });
  return wrap;
}
function numInput(v, onChange){
  const i=el('input',{type:'number', min:'1', value:v, onchange:e=>onChange(Math.max(1,+e.target.value||1))});
  return i;
}
function checkboxRow(id, label, checked){
  const w=el('label',{class:'field', style:'display:flex;align-items:center;gap:10px'});
  const c=el('input',{type:'checkbox', id, style:'width:auto'}); if(checked) c.checked=true;
  w.append(c, el('span',{class:'lab', style:'margin:0'}, label));
  return w;
}
function labeled(lab, node){ return el('label',{class:'field'},[ el('span',{class:'lab'}, lab), node ]); }
function field(lab, inner){
  if(inner && inner.nodeType){ return lab ? labeled(lab, inner) : el('div',{}, inner); }
  return el('label',{class:'field'},[ el('span',{class:'lab'}, lab), el('span',{html:inner}) ]);
}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ---------- sheet ---------- */
function sheet(title, fields, onSave, onDelete){
  const dlg=$('#sheet'); dlg.innerHTML=''; dlg.style.display='';
  const box=el('div',{class:'sheet'});
  box.append(el('h2',{}, title));
  fields.forEach(f=>box.append(f));
  const acts=el('div',{class:'row-actions', style:'margin-top:16px'});
  acts.append(el('button',{class:'btn primary', onclick:()=>{ let ok=true; try{ ok=onSave()!==false; }catch(e){ alert('Couldn’t save: '+e.message); ok=false; } if(ok) closeSheet(); }},'Save'));
  acts.append(el('button',{class:'btn ghost', onclick:closeSheet},'Cancel'));
  if(onDelete){ const db=armDelete('Delete', onDelete); db.style.marginLeft='auto'; acts.append(db); }
  box.append(acts); dlg.append(box);
  if(typeof dlg.showModal==='function') dlg.showModal();
  else { dlg.setAttribute('open',''); dlg.style.cssText='display:block;position:fixed;inset:auto 0 0 0;z-index:100'; }
}
function closeSheet(){ const d=$('#sheet'); try{ d.close(); }catch(e){} d.removeAttribute('open'); d.style.display='none'; }

/* ---------- data io ---------- */
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=el('a',{href:URL.createObjectURL(blob), download:`jarvis-backup-${todayISO()}.json`});
  document.body.append(a); a.click(); a.remove();
}
function importData(){
  const inp=el('input',{type:'file', accept:'.json,application/json'});
  inp.addEventListener('change',()=>{ const f=inp.files[0]; if(!f) return; const rd=new FileReader();
    rd.onload=()=>{ try{ S=Object.assign(structuredClone(DEFAULTS), JSON.parse(rd.result)); migrate(S); save(); render(); alert('Imported.'); }catch(e){ alert('Bad file.'); } };
    rd.readAsText(f); });
  inp.click();
}

/* ---------- onboarding wizard ---------- */
const RPRE=[['Exercise','evening','must'],['Language app','evening','must'],['Meditate','evening','normal'],['Read','winddown','low'],['Water','evening','normal'],['Vitamins','morning','normal'],['Tidy up','evening','low'],['Journal','winddown','low']];
const SPRE=['Drawing','Writing','Reading','Music','Photography','Cooking','A language','Coding'];
function onboard(){
  if(S.onboarded) return;
  const dlg=$('#sheet');
  const st={ step:0, name:S.user==='there'?'':S.user, asst:S.assistant, wake:'07:15', home:'17:15',
             routines:new Set(), rc:'', skills:new Set(), sc:'',
             proj:{name:'', deadline:'', mode:'flat', flatText:'', base:'Episode', n:0, tmpl:''} };
  function chipRow(list, set){
    const w=el('div',{class:'chips'});
    list.forEach(item=>{
      const label=Array.isArray(item)?item[0]:item;
      const b=el('button',{class:'chip'+(set.has(label)?' on':''), onclick:()=>{ set.has(label)?set.delete(label):set.add(label); b.classList.toggle('on'); }}, label);
      w.append(b);
    });
    return w;
  }
  function capture(){
    if(st.step===0){ st.name=$('#w_name').value; st.asst=$('#w_asst').value; st.wake=$('#w_wake').value; st.home=$('#w_home').value; }
    if(st.step===1){ st.rc=$('#w_rc').value; }
    if(st.step===2){ st.sc=$('#w_sc').value; }
    if(st.step===3){
      st.proj.name=$('#w_pn').value.trim();
      if($('#w_pd')) st.proj.deadline=$('#w_pd').value;
      if($('#w_pf')) st.proj.flatText=$('#w_pf').value;
      if($('#w_pt')) st.proj.tmpl=$('#w_pt').value;
    }
  }
  function draw(){
    dlg.innerHTML=''; dlg.style.display='';
    const box=el('div',{class:'sheet'});
    box.append(el('div',{class:'wizdots'}, [0,1,2,3].map(i=>el('i',{class:i<=st.step?'on':''}))));
    if(st.step===0){
      box.append(el('h2',{}, 'Let’s set up.'));
      box.append(el('p',{class:'muted', style:'margin:4px 0 8px'}, 'I hold your whole to-do list and hand you one clear plan each night. First, the basics:'));
      box.append(field('Your name', `<input id="w_name" value="${esc(st.name)}" placeholder="Kyle">`));
      box.append(field('What should I go by?', `<input id="w_asst" value="${esc(st.asst)}" placeholder="Jarvis">`));
      box.append(field('Wake-up time you’re aiming for', `<input id="w_wake" type="time" value="${st.wake}">`));
      box.append(field('When you get home from work', `<input id="w_home" type="time" value="${st.home}">`));
    } else if(st.step===1){
      box.append(el('h2',{}, 'What would you like to fit into your day?'));
      box.append(el('p',{class:'muted', style:'margin:4px 0 10px'}, 'Tap what fits. Cadence and timing are adjustable later in Routines.'));
      box.append(chipRow(RPRE, st.routines));
      box.append(field('Add your own (comma-separated)', `<input id="w_rc" value="${esc(st.rc)}" placeholder="Duolingo, stretch">`));
    } else if(st.step===2){
      box.append(el('h2',{}, 'Anything you want to get better at?'));
      box.append(el('p',{class:'muted', style:'margin:4px 0 10px'}, 'These become Skills you level up. If you pick any, a nightly “practice a skill” routine is added.'));
      box.append(chipRow(SPRE, st.skills));
      box.append(field('Add your own', `<input id="w_sc" value="${esc(st.sc)}" placeholder="Screenwriting">`));
    } else {
      box.append(el('h2',{}, 'A project with a finish line?'));
      box.append(el('p',{class:'muted', style:'margin:4px 0 10px'}, 'Something you’re working toward. Skip if none — add projects anytime.'));
      box.append(field('Name', `<input id="w_pn" value="${esc(st.proj.name)}" placeholder="Edmontask S3 Live">`));
      box.append(labeled('Structure', segmented([['flat','One checklist'],['parts','Repeating parts']], st.proj.mode, v=>{ capture(); st.proj.mode=v; draw(); })));
      if(st.proj.mode==='flat'){
        box.append(field('Deadline (optional)', `<input id="w_pd" type="date" value="${st.proj.deadline||''}">`));
        box.append(field('To-dos — one per line', `<textarea id="w_pf" style="min-height:110px" placeholder="Draft outline\nWrite it\nEdit\nSend">${esc(st.proj.flatText)}</textarea>`));
      } else {
        const g=el('div',{class:'stagerow'});
        g.append(el('input',{value:st.proj.base, style:'flex:1', placeholder:'Part name', oninput:e=>st.proj.base=e.target.value}));
        g.append(el('input',{type:'number', min:'1', value:st.proj.n||'', style:'max-width:60px;text-align:center', placeholder:'#', oninput:e=>st.proj.n=Math.max(0,+e.target.value||0)}));
        box.append(labeled('e.g. “Episode” × 9', g));
        box.append(field('To-dos for each part — one per line', `<textarea id="w_pt" style="min-height:110px" placeholder="Import footage\nSync cameras / audio\nSync video\nEdit\nExport">${esc(st.proj.tmpl)}</textarea>`));
        box.append(field('Overall deadline (optional)', `<input id="w_pd" type="date" value="${st.proj.deadline||''}">`));
      }
    }
    const acts=el('div',{class:'row-actions', style:'margin-top:16px'});
    if(st.step>0) acts.append(el('button',{class:'btn ghost', onclick:()=>{ capture(); st.step--; draw(); }},'Back'));
    if(st.step>=1) acts.append(el('button',{class:'btn ghost', onclick:()=>{ capture(); if(st.step===3){ st.proj.name=''; finish(); } else { st.step++; draw(); } }},'Skip'));
    acts.append(el('button',{class:'btn primary', style:'margin-left:auto', onclick:()=>{ capture(); if(st.step<3){ st.step++; draw(); } else finish(); }}, st.step===3?'Finish':'Next'));
    box.append(acts);
    dlg.append(box);
    if(typeof dlg.showModal==='function'){ if(!dlg.open) dlg.showModal(); }
    else { dlg.setAttribute('open',''); dlg.style.cssText='display:block;position:fixed;inset:auto 0 0 0;z-index:100'; }
  }
  function finish(){
    S.user=(st.name||'').trim()||'there';
    S.assistant=(st.asst||'').trim()||'Jarvis';
    if(st.wake) S.wakeOverride=st.wake;
    if(st.home) S.workEnd=fmt24(parseHM(st.home)-S.driveMin);
    [...st.routines, ...st.rc.split(',').map(x=>x.trim()).filter(Boolean)].forEach(name=>{
      const pre=RPRE.find(p=>p[0]===name);
      const isWater=/water/i.test(name);
      S.routines.push({id:uid(), name, hint:'', cadence:{type:'daily'}, slot:pre?pre[1]:'evening', priority:pre?pre[2]:'normal',
        skipRest:false, lock:'', kind:isWater?'counter':'check', goal:isWater?2:1, oz:0});
    });
    const slist=[...st.skills, ...st.sc.split(',').map(x=>x.trim()).filter(Boolean)];
    slist.forEach(name=> S.skills.push({id:uid(), name, createdAt:todayISO(), sessions:[]}));
    if(slist.length && !S.routines.some(r=>r.kind==='skill'))
      S.routines.push({id:uid(), name:'Practice a skill', hint:'10 minutes — pick one', cadence:{type:'daily'}, slot:'winddown', priority:'low', skipRest:false, lock:'', kind:'skill', goal:1, oz:0});
    if(st.proj && st.proj.name){
      const base={id:uid(), name:st.proj.name, deadline:st.proj.deadline||'', perSession:2, minPerSession:45,
        priority:'normal', notes:'', subs:[], parts:[], pinned:false, archived:false, lastWorked:''};
      if(st.proj.mode==='parts' && st.proj.n>0){
        const tpl=textToTodos(st.proj.tmpl);
        for(let i=1;i<=st.proj.n;i++) base.parts.push({id:uid(), name:`${st.proj.base||'Part'} ${i}`, deadline:'', complete:false,
          subs: tpl.length?tpl.map(x=>({...x})):[{text:'Complete', done:false}]});
      } else {
        base.subs = textToTodos(st.proj.flatText);
        if(!base.subs.length) base.subs=[{text:'Get started', done:false}];
      }
      S.projects.push(base);
    }
    S.onboarded=true; save(); closeSheet(); render();
  }
  draw();
}
function fmt24(m){ m=((m%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }

/* ---------- boot ---------- */
let lastDay=todayISO();
setInterval(()=>{ const t=todayISO(); if(t!==lastDay){ lastDay=t; render(); } }, 60000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) render(); });
buildNav(); render(); onboard();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
