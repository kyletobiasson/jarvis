<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis</title>
<meta name="theme-color" content="#15110D">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
  :root{
    /* dark-first: this is the primary look, light below */
    --bg:#15110D; --surface:#1D1812; --surface-2:#252017; --line:#332C21;
    --text:#EFE7D9; --muted:#A79C8A; --faint:#746A5B;
    --accent:#E8A33D; --accent-ink:#1c1408;
    --good:#63B88C; --warn:#E0954A; --bad:#D0796A;
    --p-teal:#4FB0A5; --p-coral:#E27A6A; --p-violet:#9B8BD4;
    --p-sage:#93AC7E; --p-slate:#6E8CB0; --p-rose:#D07CA0;
    --display:"Fraunces",Georgia,"Times New Roman",serif;
    --radius:16px; --tap:48px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#FBFAF7; --surface:#FFFFFF; --surface-2:#F2EFE9; --line:#E5E0D6;
      --text:#241F18; --muted:#6A6157; --faint:#9C9488;
      --accent:#B26A12; --accent-ink:#FFFFFF;
      --good:#3C875D; --warn:#A9631A; --bad:#B4503E;
      --p-teal:#3E9187; --p-coral:#C9604E; --p-violet:#7A6BB8;
      --p-sage:#6E8A57; --p-slate:#5476A0; --p-rose:#B25A7E;
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    background:var(--bg); color:var(--text);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh; min-height:100dvh;
    padding-bottom:calc(64px + var(--safe-b));
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%; max-width:560px; margin:0 auto; padding:calc(14px + var(--safe-t)) 16px 0}
  #app{display:flex; flex-direction:column; min-width:0}
  .foot{text-align:center; color:var(--faint); font-size:.7rem; letter-spacing:.08em; padding:22px 0 6px; opacity:.55}
  h1,h2,h3{margin:0; font-weight:650; line-height:1.25}
  h2{font-size:1.05rem}
  h3{font-size:1rem}
  .display{font-family:var(--display); font-weight:600; letter-spacing:-.01em}
  .muted{color:var(--muted)} .faint{color:var(--faint)}
  button{font:inherit; color:inherit; cursor:pointer}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin:12px 0}

  header.hero{padding:20px 0 4px}
  .hero .greet{font-family:var(--display); font-size:1.9rem; font-weight:600; letter-spacing:-.02em; line-height:1.05}
  .hero .sub{color:var(--muted); margin-top:5px; font-size:.95rem}
  .clockline{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
  .pill{background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:5px 11px; font-size:.82rem; color:var(--muted); white-space:nowrap}
  .pill b{color:var(--text); font-weight:600}
  .pill.alert{border-color:var(--warn); color:var(--warn)} .pill.alert b{color:var(--warn)}

  .prog{display:flex; align-items:center; gap:12px; margin:14px 0 2px}
  .ring{--p:0; width:52px; height:52px; border-radius:50%; flex:0 0 auto;
    background:conic-gradient(var(--good) calc(var(--p)*1%), var(--surface-2) 0);
    display:grid; place-items:center; position:relative}
  .ring::after{content:""; position:absolute; inset:5px; border-radius:50%; background:var(--surface)}
  .ring span{position:relative; font-size:.8rem; font-weight:700}

  .sec{margin-top:16px}
  .sec>h2{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px; font-size:1.05rem}
  .sec>h2 .hint{font-size:.78rem; font-weight:500; color:var(--faint)}

  .row{display:flex; align-items:center; gap:12px; padding:13px 12px; background:var(--surface);
    border:1px solid var(--line); border-radius:12px; margin:8px 0; min-height:var(--tap)}
  .row.tap{cursor:pointer; user-select:none}
  .row.done{opacity:.55}
  .row.done .tx .t{text-decoration:line-through}
  .box{width:24px; height:24px; border-radius:7px; border:2px solid var(--faint); flex:0 0 auto; display:grid; place-items:center; transition:.12s}
  .row.done .box, .sub.done .box{background:var(--good); border-color:var(--good)}
  .box svg{width:14px; height:14px; opacity:0; color:#04140f}
  .row.done .box svg, .sub.done .box svg{opacity:1}
  .row .tx{flex:1; min-width:0}
  .row .tx .t{font-weight:550}
  .row .tx .d{font-size:.8rem; color:var(--muted)}
  .row .rt{font-size:.75rem; color:var(--faint); white-space:nowrap}
  .row.locked{opacity:.5}
  .row.note{display:block; color:var(--muted); font-size:.92rem; background:var(--surface-2); border-style:dashed}
  .streak{font-size:.72rem; color:var(--warn); font-weight:600; white-space:nowrap}
  .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .dot.must{background:var(--bad)} .dot.normal{background:var(--accent)} .dot.low{background:var(--faint)}

  .focuscard{border-color:var(--pc,var(--accent)); box-shadow:0 0 0 1px var(--pc,var(--accent)) inset}
  .focuscard .t{font-family:var(--display); font-weight:600; font-size:1.3rem; letter-spacing:-.01em; line-height:1.1}
  .nextstep{font-size:1rem; font-weight:600; margin-top:2px}
  .nextstep .lbl{font-size:.72rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); display:block; margin-bottom:1px}
  .breakdown{background:none; border:0; color:var(--faint); font-size:.74rem; font-weight:600; padding:2px 4px; display:block; margin-top:3px}

  /* session timer */
  .startbtn{display:flex; align-items:center; justify-content:center; gap:9px; width:100%; margin-top:13px;
    background:var(--accent); color:var(--accent-ink); border:0; border-radius:12px; padding:13px;
    font-weight:750; font-size:.98rem; letter-spacing:.01em}
  .startbtn .tri{font-size:.8rem}
  .startbtn.running{background:var(--surface-2); color:var(--text); border:1px solid var(--accent)}
  .startbtn .clock{font-family:"JetBrains Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion:no-preference){
    .startbtn.running .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:breathe 2.4s ease-in-out infinite}
  }
  .startbtn.running .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  @keyframes breathe{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
  .logtime{background:none;border:0;color:var(--faint);font-size:.78rem;font-weight:600;margin-top:8px;width:100%;text-align:center}
  .ssbtn{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 13px;font-weight:750;font-size:.84rem;color:var(--text)}
  .ssbtn.stop{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);margin-left:7px}
  .startbtn.paused{background:var(--surface-2)}
  .startbtn.paused .dot{animation:none;opacity:.35}

  /* evening ribbon */
  .ribbon{display:flex; gap:5px; margin:14px 0 2px}
  .ribbon > div{flex:1; position:relative; border-radius:7px; background:var(--surface-2); overflow:hidden;
    height:32px; display:flex; align-items:center; justify-content:center;
    font-size:.68rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--faint)}
  .ribbon > div .fill{position:absolute; left:0; top:0; bottom:0; background:var(--accent); opacity:.85; transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .ribbon > div span{position:relative; z-index:1}
  .ribbon > div.here{outline:1.5px solid var(--text); outline-offset:1px}
  .ribbon > div.full span{color:var(--accent-ink)}
  .badge{font-size:.72rem; font-weight:650; padding:2px 8px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); white-space:nowrap}
  .badge.soon{color:var(--warn); border-color:var(--warn)}
  .badge.over{color:var(--bad); border-color:var(--bad)}
  .badge.ok{color:var(--good); border-color:var(--good)}
  .deadline{font-size:.8rem; font-weight:600}
  .deadline.soon{color:var(--warn)} .deadline.over{color:var(--bad)}
  .sub-list{margin-top:8px; border-top:1px solid var(--line); padding-top:6px}
  .sub{display:flex; align-items:center; gap:10px; padding:8px 2px; font-size:.92rem; cursor:pointer}
  .sub .box{width:20px;height:20px;border-radius:6px}
  .sub.done .s{text-decoration:line-through; opacity:.6}
  .stepper{display:flex; align-items:center; gap:10px; margin-top:8px}
  .stepper button{width:38px; height:38px; border-radius:9px; border:1px solid var(--line); background:var(--surface-2); font-size:1.2rem}
  .stepper .val{font-weight:700; font-size:1rem; min-width:74px; text-align:center}

  nav{position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line);
    display:flex; padding-bottom:var(--safe-b); z-index:50}
  nav button{flex:1; background:none; border:0; padding:7px 1px 8px; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--faint); font-size:.6rem}
  nav button.on{color:var(--accent)}
  nav svg{width:20px; height:20px}

  /* momentum */
  .mo{display:flex; gap:8px; align-items:center; margin:14px 0 2px; flex-wrap:wrap; cursor:pointer}
  .mo .chip2{display:inline-flex; align-items:center; gap:5px; background:var(--surface-2); border:1px solid var(--line);
    border-radius:999px; padding:5px 11px; font-size:.82rem; font-weight:650}
  .mo .chip2.xp{color:var(--accent)} .mo .chip2.streak{color:var(--warn)}
  .xpbar{height:5px; border-radius:999px; background:var(--surface-2); overflow:hidden; flex:1 1 100%; margin-top:2px}
  .xpbar>i{display:block; height:100%; background:var(--accent); transition:width .5s cubic-bezier(.2,.8,.2,1)}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
  .box.pop{animation:pop .32s ease}
  @keyframes ringflash{0%{box-shadow:0 0 0 0 var(--good)}100%{box-shadow:0 0 0 14px transparent}}
  .ring.cleared{animation:ringflash .7s ease-out}

  .focusbanner{background:var(--surface-2); border:1px solid var(--accent);
    box-shadow:0 0 0 1px var(--accent) inset; border-radius:var(--radius); padding:14px; margin:12px 0}
  .focusbanner .ttl{font-weight:750; font-size:1.05rem; display:flex; align-items:center; gap:7px}
  .focusbanner .eta{font-size:.82rem; color:var(--muted); margin-top:3px}

  .celebrate{position:fixed; inset:0; z-index:200; display:grid; place-items:center; text-align:center; padding:28px;
    background:radial-gradient(circle at 50% 42%, rgba(232,163,61,.16), rgba(8,6,4,.86) 62%);
    backdrop-filter:blur(2px); animation:fade .3s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .celebrate .big{font-family:var(--display); font-size:2.7rem; font-weight:600; letter-spacing:-.015em; line-height:1.06; max-width:13ch;
    animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .celebrate .sub2{color:var(--muted); margin-top:12px; font-size:1.02rem; animation:rise .6s .08s cubic-bezier(.2,.8,.2,1) both}
  .celebrate .kicker{color:var(--accent); font-weight:700; letter-spacing:.18em; font-size:.78rem; text-transform:uppercase; margin-bottom:2px; animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
  .bloom{position:fixed; left:50%; top:42%; width:46vmin; height:46vmin; margin:-23vmin 0 0 -23vmin; border-radius:50%;
    background:radial-gradient(circle, var(--accent) 0%, transparent 68%); z-index:199; pointer-events:none;
    animation:bloom 1.5s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes bloom{0%{transform:scale(.25);opacity:0}35%{opacity:.85}100%{transform:scale(2.6);opacity:0}}
  .bokeh{position:fixed; inset:0; z-index:198; overflow:hidden; pointer-events:none}
  .bokeh i{position:absolute; bottom:-8vmin; border-radius:50%; background:var(--accent); filter:blur(1px); animation:float linear forwards}
  @keyframes float{to{transform:translateY(-118vh);opacity:0}}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important}
    .bloom,.bokeh{display:none}
  }

  .lvlcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin:12px 0}
  .lvlcard .lv{font-family:var(--display); font-size:1.8rem; font-weight:600; letter-spacing:-.01em}
  .statgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px}
  .statgrid .s{background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:11px}
  .statgrid .s b{display:block; font-size:1.3rem; font-weight:750}
  .statgrid .s span{font-size:.76rem; color:var(--muted)}
  .feed div{padding:8px 0; border-bottom:1px solid var(--line); font-size:.86rem; display:flex; justify-content:space-between; gap:10px}
  .feed div:last-child{border-bottom:0}
  .feed .amt{color:var(--accent); font-weight:700; white-space:nowrap}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 14px; border-radius:11px;
    border:1px solid var(--line); background:var(--surface-2); font-weight:600; font-size:.9rem}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .btn.ghost{background:none}
  .btn.sm{padding:7px 10px; font-size:.82rem}
  .btn.block{display:flex; width:100%}
  .row-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
  label.field{display:block; margin:12px 0}
  label.field .lab{font-size:.82rem; color:var(--muted); margin-bottom:5px; display:block}
  input,select,textarea{width:100%; font:inherit; color:var(--text); background:var(--surface-2);
    border:1px solid var(--line); border-radius:10px; padding:10px 12px}
  textarea{min-height:60px; resize:vertical}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .inline{display:flex; gap:8px; align-items:center}
  .seg{display:flex; gap:6px; flex-wrap:wrap}
  .seg-b{padding:7px 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface-2); font-size:.82rem; font-weight:600}
  .seg-b.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .chips{display:flex; gap:7px; flex-wrap:wrap}
  .chip{padding:9px 13px; border-radius:999px; border:1px solid var(--line); background:var(--surface-2); font-size:.86rem; font-weight:600}
  .chip.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .wizdots{display:flex; gap:5px; margin-bottom:14px}
  .wizdots>i{height:4px; flex:1; border-radius:2px; background:var(--surface-2)}
  .wizdots>i.on{background:var(--accent)}
  .daychips{display:flex; gap:5px}
  .daychips button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);font-size:.78rem;font-weight:600}
  .daychips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  dialog{border:0; border-radius:18px 18px 0 0; padding:0; width:100%; max-width:560px; margin:auto auto 0; background:var(--surface); color:var(--text)}
  dialog::backdrop{background:rgba(0,0,0,.5)}
  dialog.centered{border-radius:18px; max-width:440px; width:calc(100% - 28px); margin:auto}
  dialog.centered .sheet{max-height:82vh; padding:18px 16px 18px}
  .sheet{padding:18px 16px calc(20px + var(--safe-b)); max-height:88vh; overflow-y:auto}
  .sheet h2{margin-bottom:4px}
  .weekrow{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line)}
  .weekrow:last-child{border-bottom:0}
  .weekrow select{width:auto; flex:1; max-width:180px}
  .del{color:var(--bad); background:none; border:0; font-size:.85rem; font-weight:600}
  .empty{text-align:center; color:var(--muted); padding:26px 10px}
  .tiny{font-size:.75rem}
  .divider{height:1px; background:var(--line); margin:16px 0}
  .bar{height:7px; border-radius:999px; background:var(--surface-2); overflow:hidden; margin-top:8px}
  .bar>i{display:block; height:100%; background:var(--accent); transition:width .65s cubic-bezier(.2,.9,.25,1)}
  .hl{background:var(--surface-2)}
  .weekstrip{display:flex; gap:5px; margin-top:14px}
  .wk{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:5px}
  .wk .dl{font-size:.66rem; font-weight:700; color:var(--faint); letter-spacing:.02em}
  .wk .frame{width:100%; height:46px; border-radius:7px; border:1px solid var(--line); background:var(--surface);
    position:relative; overflow:hidden; display:flex; align-items:flex-end}
  .wk .frame .blk{width:100%; height:100%}
  .wk.rest .frame .blk{background:repeating-linear-gradient(135deg,var(--surface-2),var(--surface-2) 3px,transparent 3px,transparent 7px)}
  .wk.off .frame{border-style:dashed; background:transparent}
  .wk.today .frame{border-color:var(--text); box-shadow:0 0 0 1px var(--text)}
  .wk .frame .wdot{position:absolute; top:4px; right:4px; width:5px; height:5px; border-radius:50%; background:var(--accent)}

  .lanes{margin-top:14px; display:grid; gap:9px}
  .lane{display:flex; align-items:center; gap:8px}
  .lane .ln{width:66px; flex:none; font-size:.7rem; color:var(--muted); text-align:right; overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
  .lane .track{flex:1; height:14px; border-radius:99px; background:var(--surface-2); position:relative; overflow:visible}
  .lane .track .seg{position:absolute; top:0; bottom:0; left:0; border-radius:99px; min-width:6px}
  .lane .track .seg.late{opacity:.55; outline:1px solid var(--warn)}
  .lane .track .flag{position:absolute; top:-4px; width:2px; height:22px; background:var(--faint); border-radius:2px}
  .lane .track .flag.tight{background:var(--warn)}
  .lanes .scale{display:flex; justify-content:space-between; font-size:.66rem; color:var(--faint); margin-left:66px; margin-top:2px}
  .agrow{display:flex; gap:11px; padding:11px 0; border-bottom:1px solid var(--line)}
  .agrow:last-child{border-bottom:0}
  .agrow .marker{width:3px; border-radius:2px; flex:0 0 auto; background:var(--line)}
  .agrow .marker.focus{background:var(--accent)}
  .agrow .marker.rest,.agrow .marker.open{background:var(--surface-2)}
  .agrow .marker.off{background:transparent}
  .sdot{width:8px; height:8px; border-radius:50%; flex:0 0 auto}
  .stagestrip{display:flex; flex-direction:column; gap:4px; margin:10px 0 2px; border-left:2px solid var(--line); padding-left:10px}
  .stg{font-size:.85rem; color:var(--faint); display:flex; gap:7px; align-items:center}
  .stg .stgdot{width:14px; text-align:center; font-weight:700}
  .stg.active{color:var(--text); font-weight:600}
  .stg.active .stgdot{color:var(--accent)}
  .stg.done{color:var(--muted)} .stg.done .stgdot{color:var(--good)}
  .stagerow{display:flex; gap:6px; align-items:center; margin:6px 0}
  .stagerow input[type=text],.stagerow input:not([type]){flex:1; min-width:0}

  /* studio project cards */
  .pcard{position:relative; padding-left:18px; overflow:hidden}
  .pcard::before{content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--pc,var(--accent))}
  .pcard h3{font-family:var(--display); font-weight:600; font-size:1.15rem; letter-spacing:-.01em}
  .pcard.focusnow{box-shadow:0 0 0 1px var(--pc,var(--accent)) inset; border-color:var(--pc,var(--accent))}
  .pboard{display:flex; gap:3px; margin:11px 0 5px}
  .pboard > span{flex:1; height:15px; border-radius:3px; background:var(--surface-2); border:1px solid var(--line); position:relative; overflow:hidden}
  .pboard > span .f{position:absolute; left:0; top:0; bottom:0; background:var(--pc,var(--accent)); opacity:.55}
  .pboard > span.done{background:var(--pc,var(--accent)); border-color:var(--pc,var(--accent))}
  .pboard > span.active{border-color:var(--pc,var(--accent)); box-shadow:0 0 0 1px var(--pc,var(--accent))}

  /* practice chain grid */
  .chain{display:grid; grid-template-columns:repeat(var(--cols,14),1fr); gap:4px; margin:10px 0 4px}
  .chain > i{aspect-ratio:1; border-radius:3px; background:var(--surface-2)}

<body>

<script>
"use strict";
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,props={},kids=[])=>{const e=document.createElement(t);for(const k in props){if(k==='class')e.className=props[k];else if(k==='html')e.innerHTML=props[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),props[k]);else if(props[k]!=null)e.setAttribute(k,props[k]);}for(const c of [].concat(kids))if(c!=null)e.append(c.nodeType?c:document.createTextNode(c));return e;};
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><path d="M20 6L9 17l-5-5"/></svg>';
const WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const WD1=['S','M','T','W','T','F','S'];
const PRIOS=[['must','Must'],['normal','Normal'],['low','Low']];          // routines & one-off tasks
const PPRIOS=[['top','Top'],['medium','Medium'],['low','Low'],['planning','Planning']];  // projects
function prW(p){ return ({must:3,top:3,normal:2,medium:2,low:1,planning:0})[p] ?? 2; }
function pprioLabel(v){ const f=PPRIOS.find(x=>x[0]===v); return f?f[1]:'Medium'; }
const PCOLORS=['coral','teal','violet','sage','slate','rose'];
function projColorVar(p){ return `var(--p-${(p&&p.color)||'slate'})`; }
function nextColor(){
  const used=new Set((S.projects||[]).filter(p=>!p.archived).map(p=>p.color));
  return PCOLORS.find(c=>!used.has(c)) || PCOLORS[(S.projects||[]).length % PCOLORS.length];
}
// Craft flavour — keeps the app neutral for any discipline, swaps a few words.
const CRAFTS={
  writer:   {label:'Writer',        part:'chapter', wrap:'drafted',    body:'writing'},
  filmmaker:{label:'Filmmaker',     part:'scene',   wrap:'in the can', body:'the edit'},
  musician: {label:'Musician',      part:'track',   wrap:'mixed down', body:'the session'},
  artist:   {label:'Visual artist', part:'piece',   wrap:'finished',   body:'studio time'},
  photo:    {label:'Photographer',  part:'set',     wrap:'delivered',  body:'the shoot'},
  designer: {label:'Designer',      part:'screen',  wrap:'shipped',    body:'design time'},
  maker:    {label:'Maker',         part:'build',   wrap:'built',      body:'shop time'},
  other:    {label:'Creative',      part:'part',    wrap:'wrapped',    body:'the work'},
};
function craft(){ return CRAFTS[S.craft] || CRAFTS.other; }

/* ---------- storage ---------- */
const KEY='pa.v1';
// Ships blank. Everything is created on-device via the setup flow and stored in
// localStorage — nothing personal lives in this file or the repo.
const DEFAULTS={
  user:'there', assistant:'Jarvis', craft:'other', sound:false, remind:{winddown:false}, planNudge:'', lastBackup:'',
  workStart:'08:00', driveMin:15, morningMin:30,
  wakeOverride:'', sleepGoalH:8, workEnd:'17:00',
  week:{0:'project',1:'project',2:'rest',3:'project',4:'rest',5:'off',6:'project'},
  projects:[], routines:[], skills:[], events:[], tasks:[], checks:{}, counters:{},
  sessions:[], activeSession:null, starts:[], xp:0, xpLog:[], focus:null, onboarded:false,
};

let S = load();
function load(){
  let raw=null;
  try{ raw=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  const s = raw ? Object.assign(structuredClone(DEFAULTS), raw) : structuredClone(DEFAULTS);
  migrate(s);
  return s;
}
function migrate(s){
  ['screen','rails','waterGoal','bottleOz'].forEach(k=>delete s[k]);
  s.counters = s.counters || {};
  s.craft = s.craft || 'other';
  s.sound = !!s.sound;
  s.remind = Object.assign({winddown:false}, s.remind||{});
  s.planNudge = s.planNudge || '';
  s.lastBackup = s.lastBackup || '';
  s.sessions = (s.sessions || []).map(x=>Object.assign({id:uid()}, x));
  s.starts = s.starts || [];
  if(s.activeSession){
    const a=s.activeSession;
    if(!a.projectId) s.activeSession=null;
    else { a.startedAt = a.startedAt || Date.now();
      if(a.since===undefined) a.since = a.startedAt;   // legacy: was always running
      if(a.accumMs===undefined) a.accumMs = 0; }
  }
  if(s.water){ s.counters.water = Object.assign({}, s.counters.water, s.water); delete s.water; }
  s.projects = (s.projects||[]).map((p,i)=>{ const q=Object.assign({
    id:uid(), name:'', type:'', deadline:'', deadlineTime:'', minPerSession:60, priority:'medium',
    color:PCOLORS[i%PCOLORS.length], notes:'', subs:[], parts:[], archived:false, order:null,
    lastWorked:'', createdAt:'', completedAt:''
  }, p); delete q.active; delete q.pinned; delete q.perSession; delete q.unitLabel;
    if(!q.color) q.color=PCOLORS[i%PCOLORS.length];
    // priority: must/normal/low -> top/medium/low; keep planning
    q.priority = ({must:'top',normal:'medium'})[q.priority] || (['top','medium','low','planning'].includes(q.priority) ? q.priority : 'medium');
    const norm = x => ({text:x.text||'', done:!!x.done, deadline:x.deadline||'', deadlineTime:x.deadlineTime||'', completedAt:x.completedAt||'', id:x.id||uid()});
    const src = q.parts && q.parts.length ? q.parts : (q.stages||[]);
    q.parts = src.map(s=>{
      let subs = (s.subs && s.subs.length) ? s.subs.map(norm)
        : ((+s.total||0) > 1 ? Array.from({length:+s.total},(_,j)=>norm({text:'Step '+(j+1), done:j<(+s.done||0)}))
        : []);
      return {id:s.id||uid(), name:s.name||'', deadline:s.deadline||'', deadlineTime:s.deadlineTime||'',
        complete:!!s.complete, completedAt:s.completedAt||'', subs};
    });
    // legacy flat checklist -> each item becomes its own (subtask-less) task
    if(!q.parts.length){
      let flat = (q.subs && q.subs.length) ? q.subs.map(norm)
        : ((+p.total||0) > 1 ? Array.from({length:+p.total},(_,j)=>norm({text:((p.unitLabel||'Item').replace(/s$/i,''))+' '+(j+1), done:j<(+p.done||0)})) : []);
      q.parts = flat.map(x=>({id:uid(), name:x.text||'Task', deadline:x.deadline||'', deadlineTime:x.deadlineTime||'',
        complete:!!x.done, completedAt:x.completedAt||'', subs:[]}));
    }
    q.subs = [];
    if(q.archived && !q.completedAt) q.completedAt = q.lastWorked || '';
    delete q.stages; delete q.total; delete q.done;
    return q; });
  if(s.projects.some(p=>p.order==null)){
    [...s.projects].sort((a,b)=> prW(b.priority)-prW(a.priority) || (a.deadline||'~').localeCompare(b.deadline||'~'))
      .forEach((p,i)=>{ if(p.order==null) p.order=i; });
  }
  s.routines = (s.routines||[]).map(r=>Object.assign({
    id:uid(), name:'', hint:'', cadence:{type:'daily'}, slot:'evening', priority:'normal', skipRest:false, lock:'', kind:'check', goal:1, oz:0
  }, r));
  s.tasks = (s.tasks||[]).map(t=>Object.assign({id:uid(), text:'', due:'', priority:'normal', done:false}, t));
  s.skills = (s.skills||[]).map((k,i)=>{ const q=Object.assign({id:uid(), name:'', color:PCOLORS[(i+2)%PCOLORS.length], createdAt:todayISO(), sessions:[]}, k); if(!q.color) q.color=PCOLORS[(i+2)%PCOLORS.length]; q.sessions=(q.sessions||[]).map(x=>Object.assign({id:uid()}, x)); return q; });
  s.xp = +s.xp||0; s.xpLog = s.xpLog||[];
  if(s.focus && !(s.projects||[]).some(p=>p.id===s.focus.id)) s.focus=null;
}
let storageBroken=false;
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ if(!storageBroken){ storageBroken=true;
    alert('Jarvis can’t save on this device.\n\nThe page was likely opened as a file (file://) or storage is blocked. It needs to be served over http/https — see the setup notes.'); } }
}
function uid(){ return Math.random().toString(36).slice(2,9); }

/* ---------- momentum / XP ---------- */
function xpCum(n){ return 60*n*n + 40*n; }
function xpLevel(xp){ let n=0; while(xpCum(n+1) <= xp) n++; return n; }
function xpProg(xp){ const l=xpLevel(xp), a=xpCum(l), b=xpCum(l+1); return {level:l, into:xp-a, need:b-a, pct:Math.max(0,Math.round((xp-a)/(b-a)*100))}; }
function xpToday(){ const t=todayISO(); return S.xpLog.filter(e=>e.d===t && e.amt>0).reduce((s,e)=>s+e.amt,0); }
let _pendingCele=null;
function award(amt, label, opts){
  if(!amt) return;
  const before=xpLevel(S.xp);
  S.xp=Math.max(0, S.xp + amt);
  if(amt>0){ S.xpLog.unshift({ts:Date.now(), d:todayISO(), amt, label}); if(S.xpLog.length>250) S.xpLog.length=250; }
  const after=xpLevel(S.xp);
  if(opts && opts.cele) _pendingCele=opts.cele;
  else if(after>before) _pendingCele={kicker:'Level up', big:'Level '+after, sub:levelBlurb(after)};
}
function levelBlurb(n){
  if(n>=15) return 'Genuinely impressive consistency.';
  if(n>=10) return 'This is a habit now.';
  if(n>=6) return 'The momentum is real.';
  if(n>=3) return 'Keep the streak alive.';
  return 'You’re rolling.';
}
function flushCele(){ if(_pendingCele){ const c=_pendingCele; _pendingCele=null; celebrate(c); } }
let _actx=null;
// short warm chime — a soft major triad, sine + lowpass. Off unless S.sound.
function chime(){
  if(!S.sound) return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    _actx = _actx || new AC();
    const ac=_actx; if(ac.state==='suspended') ac.resume();
    const now=ac.currentTime;
    const master=ac.createGain(); master.connect(ac.destination);
    master.gain.setValueAtTime(0.0001, now);
    master.gain.exponentialRampToValueAtTime(0.32, now+0.03);
    master.gain.exponentialRampToValueAtTime(0.0001, now+1.7);
    const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2400; lp.Q.value=0.6; lp.connect(master);
    [523.25, 659.25, 783.99].forEach((f,i)=>{
      const o=ac.createOscillator(); o.type='sine'; o.frequency.value=f;
      const g=ac.createGain(); g.gain.value=0.34;
      o.connect(g); g.connect(lp);
      const t=now + i*0.09;
      o.start(t); o.stop(t+1.6);
    });
  }catch(e){}
}
function celebrate(o){
  document.querySelectorAll('.celebrate,.bloom,.bokeh').forEach(x=>x.remove());
  chime();
  lightBloom();
  const ov=el('div',{class:'celebrate', onclick:()=>ov.remove()}, [ el('div',{},[
    o.kicker?el('div',{class:'kicker'}, o.kicker):null,
    el('div',{class:'big'}, o.big),
    o.sub?el('div',{class:'sub2'}, o.sub):null,
    el('div',{class:'sub2', style:'margin-top:20px;opacity:.4;font-size:.76rem'}, 'tap to continue'),
  ]) ]);
  document.body.append(ov);
  setTimeout(()=>{ if(ov.isConnected) ov.remove(); }, 7000);
}
function lightBloom(){
  const b=el('div',{class:'bloom'}); document.body.append(b);
  const bk=el('div',{class:'bokeh'});
  for(let i=0;i<16;i++){ const s=8+Math.random()*26; const p=el('i');
    p.style.left=Math.random()*100+'vw'; p.style.width=p.style.height=s+'px';
    p.style.opacity=(0.08+Math.random()*0.16).toFixed(2);
    p.style.animationDuration=(2.6+Math.random()*2.4)+'s'; p.style.animationDelay=(Math.random()*.6)+'s';
    bk.append(p);
  }
  document.body.append(bk);
  setTimeout(()=>{ b.remove(); bk.remove(); }, 5600);
}

/* ---------- focus mode ---------- */
function focusActive(){ return !!(S.focus && S.focus.id && S.projects.some(p=>p.id===S.focus.id && projLive(p))); }
function focusProject(){ return focusActive() ? S.projects.find(p=>p.id===S.focus.id) : null; }
function weekMode(dow){
  const base=S.week[dow];
  if(!focusActive() || base==='project') return base;
  const rest=[0,1,2,3,4,5,6].filter(d=>S.week[d]!=='project')
    .sort((a,b)=>(S.week[a]==='off'?0:1)-(S.week[b]==='off'?0:1));
  const keep=new Set(rest.slice(0, S.focus.restPerWeek|0));
  return keep.has(dow) ? base : 'project';
}

/* ---------- dates ---------- */
function todayISO(d=new Date()){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseHM(s){ const [h,m]=(s||'0:0').split(':').map(Number); return h*60+(m||0); }
function fmtHM(mins){ mins=((mins%1440)+1440)%1440; let h=Math.floor(mins/60), m=mins%60; const ap=h<12?'AM':'PM'; let hh=h%12||12; return `${hh}:${String(m).padStart(2,'0')} ${ap}`; }
function fmtDur(min){ min=Math.max(0,Math.round(min||0)); if(min<60) return `${min} min`; const h=min/60; return (Number.isInteger(h)?h:h.toFixed(1))+` hr${h===1?'':'s'}`; }
function daysBetween(a,b){ return Math.round((Date.parse(b+'T00:00') - Date.parse(a+'T00:00'))/86400000); }
function addDays(iso,n){ const d=new Date(iso+'T00:00'); d.setDate(d.getDate()+n); return todayISO(d); }

function wakeMin(){ return S.wakeOverride ? parseHM(S.wakeOverride) : parseHM(S.workStart) - S.driveMin - S.morningMin; }
function leaveMin(){ return parseHM(S.workStart) - S.driveMin; }
function asleepMin(){ return wakeMin() - S.sleepGoalH*60; }
function windDownMin(){ return asleepMin() - 45; }

/* ---------- checks / counters ---------- */
let justTapId=null;
function dayChecks(iso){ return S.checks[iso] || (S.checks[iso]={}); }
function isDone(iso,id){ return !!dayChecks(iso)[id]; }
function routineById(id){ return S.routines.find(r=>r.id===id); }
function checkXp(r){ return r.priority==='must'?12 : r.priority==='low'?6 : 10; }
function awardForToggle(id, on){
  let amt=0, label='';
  const r=routineById(id);
  if(r){ amt=checkXp(r); label=r.name; }
  else if(id.indexOf('task:')===0){ amt=15; const t=S.tasks.find(x=>'task:'+x.id===id); label=t?t.text:'Task'; }
  else if(id==='focus'){ amt=15; label='Tonight’s focus'; }
  else return;
  award(on?amt:-amt, label);
}
function toggle(iso,id){
  const d=dayChecks(iso); const on=!d[id];
  on ? d[id]=true : delete d[id];
  justTapId=id;
  awardForToggle(id, on);
  if(on) checkDayCleared(iso);
  prune(); save(); render(); flushCele();
}
function counterVal(id,iso){ return (S.counters[id]&&S.counters[id][iso])||0; }
function counterSet(id,iso,n){
  const before=counterVal(id,iso); n=Math.max(0,n);
  (S.counters[id]||(S.counters[id]={}))[iso]=n;
  const r=routineById(id), goal=r?(r.goal||1):1;
  if(before<goal && n>=goal){ award(10, r?r.name:'Water'); checkDayCleared(iso); }
  else if(before>=goal && n<goal) award(-10, r?r.name:'Water');
  save(); render(); flushCele();
}
function ringStatus(iso){
  const dow=new Date(iso+'T00:00').getDay(), mode=weekMode(dow);
  const nowMin=new Date().getHours()*60+new Date().getMinutes();
  const out = nowMin>=12*60 && eveningCommitment(iso);
  const due=S.routines.filter(r=>routineDue(r,iso,mode) && r.slot!=='winddown' && r.priority!=='low');
  const fp=(mode==='project' && !out) ? pickFocus(iso) : null;
  const items=[ ...due.map(r=>({done:routineComplete(r,iso)})), ...(fp?[{done:isDone(iso,'focus')}]:[]) ];
  return {items, allDone: items.length>0 && items.every(i=>i.done)};
}
function checkDayCleared(iso){
  if(iso!==todayISO() || dayChecks(iso).__cleared) return;
  if(ringStatus(iso).allDone){
    dayChecks(iso).__cleared=true;
    award(50, 'Day cleared', {cele:{kicker:'Nice', big:'Day cleared', sub:'Everything that mattered today — done. Go rest.'}});
  }
}
function prune(){
  const cut=addDays(todayISO(),-95);
  for(const k in S.checks) if(k<cut) delete S.checks[k];
  for(const id in S.counters) for(const k in S.counters[id]) if(k<cut) delete S.counters[id][k];
  S.events = S.events.filter(e=> e.date >= addDays(todayISO(),-2));
}

/* ---------- routines ---------- */
function routineDue(r, iso, mode){
  if(r.priority==='low' && focusActive()) return false;   // low-priority routines pause during Focus
  if(r.skipRest && (mode==='rest'||mode==='off')) return false;
  const c=r.cadence||{type:'daily'};
  const d=new Date(iso+'T00:00'), dow=d.getDay();
  switch(c.type){
    case 'daily': return true;
    case 'everyN': { const n=Math.max(1,c.n||1); return ((((daysBetween(c.anchor||iso,iso))%n)+n)%n)===0; }
    case 'weekdays': return (c.days||[]).includes(dow);
    case 'weeklyN': { const n=Math.max(1,c.n||1); if(!(c.days||[]).includes(dow)) return false;
      return (((Math.floor(daysBetween(c.anchor||iso,iso)/7)%n)+n)%n)===0; }
    case 'monthly': { const day=Math.min(31,Math.max(1,c.date||1));
      const dim=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
      return d.getDate()===day || (day>dim && d.getDate()===dim); }
    default: return true;
  }
}
function routineComplete(r, iso){
  if(r.kind==='counter') return counterVal(r.id,iso) >= (r.goal||1);
  return isDone(iso,r.id);
}

/* ---------- skills ---------- */
const LEVELS=[0,1,3,7,14,25,45,75,120,180,260,360];   // cumulative hours per level
function skillMinutes(k){ return (k.sessions||[]).reduce((t,s)=>t+(+s.min||0),0); }
function skillLevel(k){ const h=skillMinutes(k)/60; let lv=0; for(let i=0;i<LEVELS.length;i++){ if(h>=LEVELS[i]) lv=i; } return lv; }
function skillNext(k){ const h=skillMinutes(k)/60, lv=skillLevel(k); const nx=LEVELS[lv+1]; return nx==null?null:{lv:lv+1, need:nx, have:h, pct:Math.min(100, Math.round((h-LEVELS[lv])/(nx-LEVELS[lv])*100))}; }
function skillStreak(k){
  const days=new Set((k.sessions||[]).map(s=>s.date));
  let n=0; for(let i=0;i<400;i++){ const iso=addDays(todayISO(),-i);
    if(days.has(iso)) n++; else if(i>0) break; else continue; }
  return n;
}
function skillLastPracticed(k){ const ds=(k.sessions||[]).map(s=>s.date).sort(); return ds[ds.length-1]||''; }
function logSkill(k, min, iso){
  k.sessions=k.sessions||[];
  const m=Math.max(1,Math.round(min||10)), before=skillLevel(k);

function routineStreak(r){
  let n=0;
  for(let i=0;i<160;i++){
    const d=new Date(); d.setDate(d.getDate()-i);
    const iso=todayISO(d), mode=weekMode(d.getDay());

  }

}
function cadenceLabel(c){
  c=c||{type:'daily'};
  if(c.type==='daily') return 'every day';
  if(c.type==='everyN') return `every ${c.n||1} days`;

  if(c.type==='weeklyN') return `every ${c.n||1} wks · ${(c.days||[]).map(d=>WD[d].slice(0,3)).join(' ')}`;
  if(c.type==='monthly') return `day ${c.date||1} monthly`;
  return '';
}

/* ---------- events ---------- */
function eventsOn(iso){ return S.events.filter(e=>e.date===iso).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99')); }
function eveningCommitment(iso){ return eventsOn(iso).some(e=> !e.time || parseHM(e.time) >= 16*60); }

/* ---------- projects / scheduler ---------- */
// Project -> ordered Tasks -> ordered Subtasks. A task with no subtasks is its own
// unit of work (done when task.complete). curr() = the first task still open.
const EST_PER_SESSION = 2;   // auto-estimated tasks/subtasks completed per focus night
function hasParts(p){ return p.parts && p.parts.length>0; }
function taskDone(t){ return t.complete || (t.subs && t.subs.length>0 && t.subs.every(s=>s.done)); }
function taskUnitsLeft(t){ return taskDone(t) ? 0 : ((t.subs && t.subs.length) ? t.subs.filter(s=>!s.done).length : 1); }
function taskUnitsTotal(t){ return (t.subs && t.subs.length) ? t.subs.length : 1; }
function curr(p){
  if(hasParts(p)) return p.parts.find(t=>!taskDone(t)) || p.parts[p.parts.length-1];
  return p;
}
function deadlineOf(p){ const c=curr(p); return (c!==p && c.deadline) || p.deadline || ''; }
function deadlineTimeOf(p){ const c=curr(p); return (c!==p && c.deadline) ? (c.deadlineTime||'') : (p.deadline ? (p.deadlineTime||'') : ''); }
function pDone(p){ const c=curr(p); if(c===p) return 0;
  return (c.subs && c.subs.length) ? c.subs.filter(s=>s.done).length : (c.complete?1:0); }
function pTotal(p){ const c=curr(p); if(c===p) return 0; return taskUnitsTotal(c); }
function pRemaining(p){ return Math.max(0, pTotal(p) - pDone(p)); }
function projRemaining(p){ return hasParts(p) ? p.parts.reduce((t,x)=>t+taskUnitsLeft(x),0) : 0; }
function projTotal(p){ return hasParts(p) ? p.parts.reduce((t,x)=>t+taskUnitsTotal(x),0) : 0; }
function projLive(p){ return !p.archived && hasParts(p) && p.parts.some(t=>!taskDone(t)); }
function unit(p,n){ return Math.abs(n)===1 ? 'task' : 'tasks'; }
function perSessionOf(p){ return EST_PER_SESSION; }
function minPerSessionOf(p){ return +p.minPerSession || 60; }
function liveProjects(){ return S.projects.filter(p=>projLive(p) && p.priority!=='planning'); }
function focusNightsPerWeek(){ return [0,1,2,3,4,5,6].filter(d=>weekMode(d)==='project').length || 3; }

function score(o, iso, fnpw){
  const per=Math.max(1,o.per||1);
  let daysLeft=null, pressure=0.45, fnl=null, need=null;
  if(o.deadline){
    daysLeft=daysBetween(iso,o.deadline);
    if(daysLeft<=0) pressure=99;
    else { fnl=Math.max(1,Math.round(daysLeft*fnpw/7)); need=o.remaining/fnl; pressure=need/per; }
  }
  const tier = (daysLeft!=null&&daysLeft<=0)?3 : pressure>1.15?2 : 1;
  return {daysLeft,pressure,fnl,need,per,tier};
}
function cmp(a,b,iso,fnpw){
  const sa=score(a,iso,fnpw), sb=score(b,iso,fnpw);
  if(sa.tier!==sb.tier) return sb.tier-sa.tier;
  const pa=prW(a.priority), pb=prW(b.priority);
  if(pa!==pb) return pb-pa;
  if(Math.abs(sa.pressure-sb.pressure)>1e-6) return sb.pressure-sa.pressure;
  return (a.lastWorked||'').localeCompare(b.lastWorked||'');
}
function amountFor(s){
  let amt=s.per;
  if(s.need!=null) amt=Math.max(s.per, Math.round(s.need));
  return Math.max(1, Math.min(amt, s.per*2));   // never suggest more than 2 sessions' worth in one night
}
// earliest live deadline that bears on a task: its own, its incomplete subtasks', or the project's
function taskDeadline(t, p){
  const subDl=(t.subs||[]).filter(s=>!s.done && s.deadline).map(s=>s.deadline).sort()[0];
  return [t.deadline, subDl, p&&p.deadline].filter(Boolean).sort()[0] || '';
}
// remaining work as an ordered list of tasks ({name, remaining, deadline})
function workParts(p){
  return (p.parts||[]).filter(t=>!taskDone(t)).map(t=>({
    name:t.name, remaining:taskUnitsLeft(t), deadline:taskDeadline(t, p) }));
}
let skipTonight = new Set();
function pickFocus(iso){
  const fpj=focusProject();
  let cands=liveProjects();
  if(!fpj) cands=cands.filter(p=>!skipTonight.has(p.id));
  if(!cands.length && skipTonight.size){ skipTonight.clear(); cands=liveProjects(); }
  if(!cands.length) return null;
  const fnpw=focusNightsPerWeek();
  const base = fpj ? [fpj] : cands;
  const pool=base.map(p=>({p, deadline:(hasParts(p)?taskDeadline(curr(p),p):deadlineOf(p)), remaining:projRemaining(p), per:perSessionOf(p), priority:p.priority, lastWorked:p.lastWorked||''}));
  pool.sort((a,b)=>cmp(a,b,iso,fnpw));
  const win=pool[0], s=score(win,iso,fnpw);
  const amount=Math.min(win.remaining, amountFor(s));
  const st = hasParts(win.p) ? curr(win.p) : null;
  let status;
  if(s.daysLeft!=null&&s.daysLeft<=0) status={cls:'over', txt:'past its deadline — do what you can'};
  else if(!win.deadline) status={cls:'', txt:`steady pace · ${win.remaining} ${unit(win.p,win.remaining)} left · add a deadline for real pacing`};
  else if(s.pressure>1.25) status={cls:'soon', txt:`behind — ${amount} ${unit(win.p,amount)} tonight to catch up · ${s.fnl} focus nights to deadline`};
  else if(s.pressure<0.7) status={cls:'ok', txt:`ahead — ${win.remaining} left over ~${s.fnl} focus nights`};
  else status={cls:'', txt:`on pace — ${win.remaining} ${unit(win.p,win.remaining)} over ~${s.fnl} focus nights`};
  return {project:win.p, part:st, amount, status, feas:feasibility(win.p)};
}

let _simKey='', _simCache=null;
function simFinishes(){
  const key=JSON.stringify(S.projects.map(p=>[p.id,p.archived,p.priority,p.minPerSession,workParts(p)]))
    +JSON.stringify(S.week)+JSON.stringify(S.events)+JSON.stringify(S.focus||0);
  if(_simKey===key) return _simCache;
  _simKey=key; _simCache=buildProjection(150).finishes;
  return _simCache;
}
function planSpan(){
  const fins=simFinishes()||[]; const t=todayISO(); let max=21;
  fins.forEach(f=>{ const e=f.finish||f.partFinish; if(e) max=Math.max(max,daysBetween(t,e));
    if(f.deadline) max=Math.max(max,daysBetween(t,f.deadline)); });
  return Math.max(14, Math.min(120, max+2));
}
function planLanes(){
  const fins=simFinishes()||[], t=todayISO(), span=planSpan();
  return liveProjects().map(p=>{
    const f=fins.find(x=>x.id===p.id)||{};
    const end=f.finish||addDays(t,span);
    const dl=deadlineOf(p);
    const late=!!(f.finish && dl && f.finish>dl);
    return {
      p, color:projColorVar(p),
      pct: Math.min(100, Math.max(4, daysBetween(t,end)/span*100)),
      flag: dl ? daysBetween(t,dl)/span*100 : null,
      tight: dl ? (daysBetween(t,dl)<=10 || late) : false,
      late,
    };
  });
}
function feasibility(p){
  if(!deadlineOf(p)) return null;
  const f=(simFinishes()||[]).find(x=>x.id===p.id);
  if(!f) return null;
  const target = f.partFinish || f.finish;         // active part's projected completion
  const dl = deadlineOf(p);
  const ok = target && target<=dl;
  return {ok, finish:target, late: target? Math.max(0, daysBetween(dl, target)) : null, parted:hasParts(p), partName: hasParts(p)?curr(p).name:'' };
}

function buildProjection(days){
  const fnpw=focusNightsPerWeek();
  const fpid = focusProject() ? S.focus.id : null;
  const sim=liveProjects().map(p=>({
    p, parts:workParts(p), si:0, per:perSessionOf(p), minPer:minPerSessionOf(p),
    priority:p.priority, focus:p.id===fpid, lastWorked:p.lastWorked||'', finish:null, partFinish:null
  }));
  const left=s=>s.parts.slice(s.si).reduce((t,x)=>t+Math.max(0,x.remaining),0);
  const out=[];
  for(let i=0;i<days;i++){
    const iso=addDays(todayISO(), i);
    const dow=new Date(iso+'T00:00').getDay(), mode=weekMode(dow);
    const evs=eventsOn(iso);
    const blocked=evs.some(e=>!e.time||parseHM(e.time)>=16*60);
    const day={iso, dow, mode, events:evs.map(e=>e.title), focus:null};
    if(mode==='project' && !blocked){
      const active=sim.filter(s=> s.si<s.parts.length && left(s)>0);
      const fp=active.filter(s=>s.focus);
      const pool=(fp.length?fp:active);
      if(pool.length){
        pool.forEach(s=>{ s._o={deadline:s.parts[s.si].deadline, remaining:s.parts[s.si].remaining, per:s.per, priority:s.priority, lastWorked:s.lastWorked}; });
        pool.sort((a,b)=>cmp(a._o,b._o,iso,fnpw));
        const w=pool[0], sc=score(w._o,iso,fnpw);
        const amt=Math.max(1, Math.min(w._o.remaining, amountFor(sc)));
        w.parts[w.si].remaining-=amt; w.lastWorked=iso;
        let doneNote='';
        if(w.parts[w.si].remaining<=0){
          if(w.si===0 && !w.partFinish) w.partFinish=iso;
          const finishedPart=w.parts[w.si].name; w.si++;
          if(w.si>=w.parts.length){ if(!w.finish) w.finish=iso; doneNote=' — done ✓'; }
          else if(finishedPart) doneNote=` — “${finishedPart}” done`;
        }
        day.focus={pid:w.p.id, color:projColorVar(w.p), name:w.p.name, part:(hasParts(w.p)&&w.parts[Math.min(w.si,w.parts.length-1)])?w.parts[Math.min(w.si,w.parts.length-1)].name:'',
          amount:amt, unit:unit(w.p,amt), note:doneNote, mins:w.minPer*(amt/Math.max(1,w.per))};
      }
    }
    out.push(day);
  }
  const finishes=sim.map(s=>({id:s.p.id, name:s.p.name, deadline:s.parts[0]?s.parts[0].deadline:'', finish:s.finish, partFinish:s.partFinish, remaining:left(s)}));
  return {out, finishes};
}

    .map(t=>{
      const over = t.due && t.due<iso;
      return taskRow(iso,{id:'task:'+t.id, t:t.text, d: over?`overdue ${daysBetween(t.due,iso)}d`:(t.due?'':'no date'), prio:t.priority, _task:t});
    })));

  const morn=bySlot('morning');
  if(morn.length) app.append(section('Morning', morn.map(r=>routineRow(iso,r))));

  const evenRows=bySlot('evening').map(r=>routineRow(iso,r));
  app.append(section(mode==='off'||mode==='rest'?'Still do':'This evening', evenRows));

  const wd=el('div',{class:'sec'});
  wd.append(el('h2',{},[ 'Wind-down', el('span',{class:'hint'}, bySlot('winddown').length>1?'pick what fits':'') ]));
  bySlot('winddown').forEach(r=> wd.append(routineRow(iso,r)));
  wd.append(noteRow(`Then: shower, in bed by ${fmtHM(asleepMin())}. Phone on the charger across the room.`));
  app.append(wd);
}

function pill(html, alert=false){ return el('span',{class:'pill'+(alert?' alert':''), html}); }
function section(title, rows){
  const s=el('div',{class:'sec'}); s.append(el('h2',{}, title));
  rows.forEach(r=>s.append(r));
  if(!rows.length) s.append(el('div',{class:'empty tiny'},'Nothing here.'));
  return s;
}
function noteRow(txt){ return el('div',{class:'row note'}, txt); }

function routineRow(iso, r){
  if(r.kind==='counter') return counterRow(iso,r);
  const done=isDone(iso,r.id);
  const now=new Date(); const nowMin=now.getHours()*60+now.getMinutes();
  const locked = r.lock && todayISO()===iso && nowMin < parseHM(r.lock);
  const row=el('div',{class:'row tap'+(done?' done':'')+(locked?' locked':'')});
  row.append(el('div',{class:'box'+(justTapId===r.id?' pop':''), html:CHECK}));
  const tx=el('div',{class:'tx'});
  tx.append(el('div',{class:'t'}, r.name));
  if(r.hint) tx.append(el('div',{class:'d'}, r.hint));
  row.append(tx);
  const st=routineStreak(r);
  if(st>1) row.append(el('div',{class:'streak'}, `\u{1f525} ${st}`));
  else if(locked) row.append(el('div',{class:'rt'}, `after ${fmtHM(parseHM(r.lock))}`));
  else if(r.kind==='skill' && !done) row.append(el('div',{class:'rt'}, 'log →'));
  row.addEventListener('click',()=>{
    if(locked && !done) return;
    if(r.kind==='skill' && !done){ return logSkillSheet(iso, r.id); }
    toggle(iso, r.id);
  });
  return row;
}
function counterRow(iso, r){
  const n=counterVal(r.id,iso), goal=r.goal||1, hit=n>=goal;
  const row=el('div',{class:'row'+(hit?' done':'')});
  row.append(el('div',{class:'box', html:CHECK}));
  const tx=el('div',{class:'tx'});
  tx.append(el('div',{class:'t'}, r.name));
  tx.append(el('div',{class:'d'}, `${n} of ${goal}${r.oz?` · ${n*r.oz} oz`:''}${hit?' — done':''}`));
  row.append(tx);
  row.append(el('div',{class:'inline'},[
    el('button',{class:'btn sm', style:'padding:6px 12px', onclick:()=>counterSet(r.id,iso,n-1)},'−'),
    el('button',{class:'btn sm primary', style:'padding:6px 12px', onclick:()=>counterSet(r.id,iso,n+1)},'+'),
  ]));
  return row;
}
function taskRow(iso, r){
  const done=isDone(iso,r.id);
  const row=el('div',{class:'row tap'+(done?' done':'')});
  row.append(el('div',{class:'box'+(justTapId===r.id?' pop':''), html:CHECK}));
  const tx=el('div',{class:'tx'});
  tx.append(el('div',{class:'t'}, r.t));
  if(r.d) tx.append(el('div',{class:'d'}, r.d));
  row.append(tx);
  if(r.prio && r.prio!=='normal') row.append(el('div',{class:'dot '+r.prio}));
  row.addEventListener('click',()=>{ if(r._task) r._task.done=!done; toggle(iso,r.id); });
  return row;
}

function afterProgress(p, iso){
  (p.parts||[]).forEach(c=>{
    if(!c.subs || !c.subs.length) return;
    const all = c.subs.every(x=>x.done);
    if(all && !c.complete){
      c.complete=true; c.completedAt=iso;
      const dn=p.parts.filter(taskDone).length;
      if(dn<p.parts.length) award(250,'Task done: '+c.name, {cele:{kicker:'Task complete', big:'“'+c.name+'” done', sub:`${p.name} · ${dn} of ${p.parts.length}`}});
    } else if(!all && c.complete){
      c.complete=false; c.completedAt='';
    }
  });
}
function checkProjectWrap(p, iso, wasLive){
  if(wasLive && !projLive(p)){
    p.archived=true; p.completedAt=iso;
    if(S.focus && S.focus.id===p.id) S.focus=null;
    award(600,'Project done: '+p.name, {cele:{kicker:'Wrapped', big:p.name, sub:'Finished. Off your plate for good.'}});
  }
}
function afterStep(p, s, iso){
  const wasLive=projLive(p);
  s.done=!s.done; s.completedAt = s.done ? iso : ''; p.lastWorked=iso;
  award(s.done?50:-50, s.text);
  afterProgress(p, iso);
  checkProjectWrap(p, iso, wasLive);
  checkDayCleared(iso); save(); render(); flushCele();
}
function afterTask(p, t, iso){
  const wasLive=projLive(p);
  t.complete=!t.complete; t.completedAt = t.complete ? iso : ''; p.lastWorked=iso;
  award(t.complete?120:-120, 'Task: '+t.name);
  if(t.complete){
    const dn=p.parts.filter(taskDone).length;
    if(wasLive && dn<p.parts.length) _pendingCele={kicker:'Task complete', big:'“'+t.name+'” done', sub:`${p.name} · ${dn} of ${p.parts.length}`};
  }
  checkProjectWrap(p, iso, wasLive);
  checkDayCleared(iso); save(); render(); flushCele();
}

/* ---- session timer (pausable: since = running-segment start or null; accumMs = banked) ---- */
let _tick=null;
function activeSessionProject(){ return S.activeSession ? S.projects.find(p=>p.id===S.activeSession.projectId) : null; }
function sessionRunning(){ return !!(S.activeSession && S.activeSession.since); }
function sessionMins(){ if(!S.activeSession) return 0; const a=S.activeSession;
  return Math.max(0, (a.accumMs + (a.since ? Date.now()-a.since : 0))/60000); }
function fmtClock(mins){ let s=Math.floor(mins*60); const h=Math.floor(s/3600); s%=3600; const m=Math.floor(s/60); s%=60;
  return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(s).padStart(2,'0'); }
function startSession(p){
  if(S.activeSession && S.activeSession.projectId!==p.id) stopSession(true);
  S.activeSession={projectId:p.id, startedAt:Date.now(), since:Date.now(), accumMs:0};
  (S.starts||(S.starts=[])).unshift({ts:Date.now(), projectId:p.id});
  if(S.starts.length>300) S.starts.length=300;
  save(); render(); ensureTick();
}
function pauseSession(){
  const a=S.activeSession; if(!a || !a.since) return;
  a.accumMs += Date.now()-a.since; a.since=null;
  stopTick(); save(); render();
}
function resumeSession(){
  const a=S.activeSession; if(!a || a.since) return;
  a.since=Date.now(); save(); render(); ensureTick();
}
function stopSession(silent){
  if(!S.activeSession) return;
  const p=activeSessionProject();
  const mins=Math.max(1, Math.round(sessionMins()));
  const d=todayISO(new Date(S.activeSession.startedAt||Date.now()));
  S.activeSession=null; stopTick();
  if(p){
    S.sessions.push({id:uid(), date:d, projectId:p.id, min:mins});
    if(S.sessions.length>400) S.sessions=S.sessions.slice(-400);
    p.lastWorked=d;
    award(mins, `${p.name} — ${fmtDur(mins)} on ${craft().body}`);
    if(mins>=3) dayChecks(d).focus=true;
  }
  if(!silent){ checkDayCleared(todayISO()); save(); render(); flushCele(); }
  else save();
}
function logSessionManual(p){
  let m=25;
  sheet('Log a session — '+p.name, [ field('How long did you work? (minutes)', numInput(25,v=>m=v)) ], ()=>{
    const d=todayISO();
    S.sessions.push({id:uid(), date:d, projectId:p.id, min:Math.max(1,Math.round(m))});
    p.lastWorked=d; award(Math.max(1,Math.round(m)), `${p.name} — ${fmtDur(m)}`);
    if(m>=3) dayChecks(d).focus=true;
    checkDayCleared(d); save(); render(); flushCele(); return true;
  });
}
function editSession(sess){
  let m=sess.min;
  const label = sess.skillId ? (S.skills.find(k=>k.id===sess.skillId)||{}).name : (S.projects.find(x=>x.id===sess.projectId)||{}).name;
  sheet('Edit logged time', [
    field('', el('p',{class:'muted tiny', style:'margin:0 0 4px'}, `${label||'Session'} · ${dstr(sess.date)}`)),
    field('Minutes', numInput(sess.min, v=>m=v)),
  ], ()=>{
    const nm=Math.max(1, Math.round(m));
    const arr = sess.skillId ? (S.skills.find(k=>k.id===sess.skillId)||{}).sessions : S.sessions;
    const row = (arr||[]).find(x=>x.id===sess.id); if(!row) return false;
    S.xp = Math.max(0, S.xp + (nm - row.min));   // adjust XP by the delta, silently
    row.min = nm; save(); render(); return true;
  }, ()=>{
    const arr = sess.skillId ? (S.skills.find(k=>k.id===sess.skillId)||{}).sessions : S.sessions;
    const i = (arr||[]).findIndex(x=>x.id===sess.id); if(i<0) return;
    S.xp = Math.max(0, S.xp - arr[i].min);
    arr.splice(i,1); save(); closeSheet(); render();
  }, {centered:true});
}
function ensureTick(){ if(_tick || !sessionRunning()) return; _tick=setInterval(()=>{ if(view==='today'){ const c=document.querySelector('.startbtn .clock'); if(c) c.textContent=fmtClock(sessionMins()); } }, 1000); }
function stopTick(){ if(_tick){ clearInterval(_tick); _tick=null; } }
function minsToday(pid){ const d=todayISO(); return (S.sessions||[]).filter(x=>x.date===d && x.projectId===pid).reduce((t,x)=>t+x.min,0); }

function autoFocusCard(fp, iso){
  const p=fp.project, st=fp.part, cw=curr(p);
  const c=el('div',{class:'card focuscard'});
  c.style.setProperty('--pc', projColorVar(p));
  const running = S.activeSession && S.activeSession.projectId===p.id;

  c.append(el('div',{class:'t', style:`color:${projColorVar(p)}`}, p.name));
  const ti = p.parts.indexOf(cw);
  const hasSubs = cw!==p && cw.subs && cw.subs.length>0;
  c.append(el('div',{class:'muted', style:'font-size:.86rem;margin-top:1px'},
    cw===p ? 'no tasks yet' :
    hasSubs ? `${cw.name?cw.name+' · ':''}${pDone(p)} of ${pTotal(p)} subtasks` :
    `${cw.name} · task ${ti+1} of ${p.parts.length}`));

  const meta=el('div',{class:'inline', style:'gap:7px;margin:9px 0 0;flex-wrap:wrap'});
  const dl=deadlineTag(deadlineOf(p), deadlineTimeOf(p)); if(dl) meta.append(dl);
  if(S.focus && S.focus.id===p.id) meta.append(el('span',{class:'badge ok'},'\u{1f3af} focus'));
  if(p.priority!=='medium') meta.append(el('span',{class:'badge'}, pprioLabel(p.priority)));
  if(p.type) meta.append(el('span',{class:'badge'}, p.type));
  const mt=minsToday(p.id); if(mt) meta.append(el('span',{class:'badge'}, `${fmtDur(mt)} today`));
  if(meta.children.length) c.append(meta);

  if(fp.feas && !fp.feas.ok) c.append(el('div',{class:'tiny', style:'margin-top:7px;color:var(--warn)'},
    `${fp.feas.finish?`${fp.feas.partName?`“${fp.feas.partName}” `:''}running past its deadline — projected ${dstr(fp.feas.finish)}. Add a focus night or move the date.`:'won’t finish at this pace yet.'}`));
  else c.append(el('div',{class:'muted tiny', style:'margin-top:7px'}, fp.status.txt));

  // an imminent subtask deadline inside the current task
  if(hasSubs){
    const us = cw.subs.filter(s=>!s.done && s.deadline).sort((a,b)=>a.deadline.localeCompare(b.deadline))[0];
    if(us){
      const n=daysBetween(iso, us.deadline);
      if(n<=3) c.append(el('div',{class:'tiny', style:'margin-top:6px;color:var(--warn)'},
        `⏰ “${us.text}” ${n<0?`${-n}d overdue`:n===0?'due today':`due ${dstr(us.deadline)}`}`));
    }
  }

  if(hasParts(p)) c.append(partStrip(p));

  // the next step
  const next = hasSubs ? cw.subs.find(s=>!s.done) : null;
  const stale = p.lastWorked && daysBetween(p.lastWorked, iso) >= 4;
  if(next){
    c.append(el('div',{class:'nextstep', style:'margin-top:11px'},[
      el('span',{class:'lbl'}, stale ? 'Stuck here? make it smaller' : 'Next step'),
      el('span',{}, next.text),
      el('button',{class:'breakdown', onclick:()=>breakDown(p, next)}, 'break it down →'),
    ]));
  } else if(cw!==p && !hasSubs){
    c.append(el('div',{class:'nextstep', style:'margin-top:11px'},[
      el('span',{class:'lbl'}, stale ? 'Stuck? make it smaller' : 'This task'),
      el('span',{}, cw.name),
      el('button',{class:'breakdown', onclick:()=>breakTask(p, cw)}, 'break into subtasks →'),
    ]));
  } else if(cw!==p){
    c.append(el('div',{class:'nextstep', style:'margin-top:11px;color:var(--good)'}, `“${cw.name}” is done — tap to close it out`));
  }

  // Start / running / paused
  if(running){
    const paused = !sessionRunning();
    const bar=el('div',{class:'startbtn running'+(paused?' paused':'')});
    bar.append(el('span',{class:'dot'}));
    bar.append(el('span',{}, paused?'Paused':'Working'));
    bar.append(el('span',{class:'clock'}, fmtClock(sessionMins())));
    bar.append(el('button',{class:'ssbtn', style:'margin-left:auto', onclick: paused?resumeSession:pauseSession}, paused?'Resume':'Pause'));
    bar.append(el('button',{class:'ssbtn stop', onclick:()=>stopSession(false)}, 'Stop'));
    c.append(bar);
  } else {
    const sb=el('button',{class:'startbtn'});
    sb.append(el('span',{class:'tri'},'▶'));
    sb.append(el('span',{}, S.activeSession ? 'Switch here & start' : 'Start'));
    sb.addEventListener('click',()=>startSession(p));
    c.append(sb);
  }
  const lt=el('div',{class:'inline', style:'gap:12px;justify-content:center;margin-top:8px;flex-wrap:wrap'});
  lt.append(el('button',{class:'logtime', style:'width:auto;margin:0', onclick:()=>logSessionManual(p)}, 'log time manually'));
  if(!(S.focus && S.focus.id===p.id) && liveProjects().filter(x=>!skipTonight.has(x.id)).length>1)
    lt.append(el('button',{class:'logtime', style:'width:auto;margin:0', onclick:()=>{ skipTonight.add(p.id); render(); }}, 'not tonight — pick another →'));
  c.append(lt);

  // full checklist
  const list=el('div',{class:'sub-list'});
  if(cw!==p && !hasSubs){
    const sr=el('div',{class:'sub'});
    sr.append(el('div',{class:'box', html:CHECK}));
    sr.append(el('div',{class:'s', style:'flex:1'}, `Mark “${cw.name}” done`));
    sr.addEventListener('click',()=>afterTask(p, cw, iso));
    list.append(sr);
  } else if(cw!==p){
    cw.subs.slice().sort((a,b)=>a.done-b.done).forEach(s=>{
      const sr=el('div',{class:'sub'+(s.done?' done':'')});
      sr.append(el('div',{class:'box', html:CHECK}));
      sr.append(el('div',{class:'s', style:'flex:1'}, s.text));
      if(s.deadline) sr.append(el('span',{class:'tiny faint', style:'flex:none'}, dstr(s.deadline)));
      sr.addEventListener('click',()=>afterStep(p, s, iso));
      if(!s.done) sr.append(el('button',{class:'breakdown', style:'flex:none', onclick:e=>{ e.stopPropagation(); breakDown(p, s); }}, '⋯'));
      list.append(sr);
    });
  }
  c.append(list);
  return c;
}
function splitSheet(title, blurb, ph, apply){
  sheet(title, [
    field('', el('p',{class:'muted', style:'margin:2px 0 4px'}, blurb)),
    field('One per line', `<textarea style="min-height:110px" id="bd_t" placeholder="${ph}"></textarea>`),
  ], ()=>{
    const lines=$('#bd_t').value.split('\n').map(l=>l.trim()).filter(Boolean);
    if(!lines.length) return false;
    apply(lines); save(); render(); return true;
  });
}
function breakDown(p, step){
  splitSheet('Make it smaller',
    `Break “${step.text}” into the smallest first moves — the point is to make starting trivial.`,
    'Open the project file\nWatch the first take\nMark the in-point',
    lines=>{
      const list = curr(p).subs, i = list.indexOf(step);
      if(i<0) return;
      list.splice(i, 1, ...lines.map(t=>({id:uid(), text:t, done:false, deadline:'', deadlineTime:'', completedAt:''})));
    });
}
function breakTask(p, t){
  splitSheet('Break into subtasks',
    `Split “${t.name}” into steps. Each becomes a checkable subtask.`,
    'First step\nNext step\nLast step',
    lines=>{
      t.subs = lines.map(x=>({id:uid(), text:x, done:false, deadline:'', deadlineTime:'', completedAt:''}));
      t.complete=false; t.completedAt='';
    });
}
function partStrip(p){
  const w=el('div',{class:'stagestrip'});
  const parts=p.parts, active=curr(p), ci=parts.indexOf(active);
  let shown=parts;
  if(parts.length>6){
    const from=Math.max(0, Math.min(ci-1, parts.length-5));
    shown=parts.slice(from, from+5);
    if(from>0) w.append(el('div',{class:'stg done'}, [ el('span',{class:'stgdot'},'✓'), el('span',{}, `${from} done`) ]));
  }
  shown.forEach(s=>{
    const done=taskDone(s);
    const state = done ? 'done' : (s===active ? 'active' : 'up');
    const has=(s.subs||[]).length;
    const dn=(s.subs||[]).filter(x=>x.done).length;
    w.append(el('div',{class:'stg '+state}, [
      el('span',{class:'stgdot'}, done?'✓':(state==='active'?'▸':'')),
      el('span',{style:'flex:1'}, s.name),
      el('span',{class:'tiny'}, done?'':(has?`${dn}/${has}`:'')),
    ]));
  });
  const tailFrom = shown.length && parts.indexOf(shown[shown.length-1])+1;
  if(tailFrom && tailFrom<parts.length) w.append(el('div',{class:'stg up'}, [ el('span',{class:'stgdot'},''), el('span',{}, `+${parts.length-tailFrom} more`) ]));
  return w;
}
function deadlineTag(d, t){
  if(!d) return null;
  const n=daysBetween(todayISO(), d);
  const tm = t ? ' '+fmtHM(parseHM(t)) : '';
  let cls='deadline', txt;
  if(n<0){ cls+=' over'; txt=`${-n}d overdue`; }
  else if(n===0){ cls+=' over'; txt='due today'+tm; }
  else if(n<=10){ cls+=' soon'; txt=`${n}d left`+(tm?` ·${tm}`:''); }
  else txt=`due ${new Date(d+'T00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})}${tm} · ${n}d`;
  return el('span',{class:cls}, txt);
}

function grip(){
  return el('span',{class:'reorder'},[
    el('button',{class:'mv mv-up', 'aria-label':'Move up', html:'▲'}),

// pointer-based drag reorder + ▲/▼ fallback. Per direct child of `container`:
// binds the first .drag handle for dragging and .mv-up / .mv-dn buttons for discrete moves.
function dragList(container, onReorder){
  const rows = () => [...container.children];
  rows().forEach(row=>{
    const up=row.querySelector('.mv-up'), dn=row.querySelector('.mv-dn');
    if(up) up.addEventListener('click',()=>{ const i=rows().indexOf(row); if(i>0) onReorder(i, i-1); });
    if(dn) dn.addEventListener('click',()=>{ const i=rows().indexOf(row); if(i>=0 && i<rows().length-1) onReorder(i, i+1); });
    const h = row.querySelector('.drag');
    if(!h) return;
    h.addEventListener('pointerdown', e=>{
      e.preventDefault();
      const start = rows().indexOf(row);
      row.classList.add('dragging');
      try{ h.setPointerCapture(e.pointerId); }catch(_){}
      const move = ev=>{
        const y = ev.clientY;
        for(const s of rows()){
          if(s===row) continue;
          const r=s.getBoundingClientRect();
          if(y>=r.top && y<=r.bottom){
            container.insertBefore(row, (y < r.top + r.height/2) ? s : s.nextSibling);
            break;
          }
        }
      };
      const up = ()=>{
        h.removeEventListener('pointermove', move);
        h.removeEventListener('pointerup', up);
        try{ h.releasePointerCapture(e.pointerId); }catch(_){}
        row.classList.remove('dragging');
        const end = rows().indexOf(row);
        if(end>=0 && end!==start) onReorder(start, end);
      };
      h.addEventListener('pointermove', move);
      h.addEventListener('pointerup', up);
    });
  });
}

// live task/subtask editor rendered onto a page mount
function taskBoard(mount, p, persist, checkable){
  const tasks=p.parts;
  persist = persist || (()=>afterProjectEdit(p));
  function dateChip(o){
    const open = o._dOpen ?? !!o.deadline;
    if(!open) return el('button',{class:'mini'+(o.deadline?' on':''), onclick:()=>{ o._dOpen=true; draw(); }},
      o.deadline ? dstr(o.deadline)+(o.deadlineTime?' '+fmtHM(parseHM(o.deadlineTime)):'') : '📅 date');
    const w=el('span',{class:'inline', style:'gap:4px;flex-wrap:wrap'});
    w.append(el('input',{type:'date', value:o.deadline||'', onchange:e=>{ o.deadline=e.target.value; persist(); }}));
    w.append(el('input',{type:'time', value:o.deadlineTime||'', onchange:e=>{ o.deadlineTime=e.target.value; persist(); }}));
    w.append(el('button',{class:'mini', onclick:()=>{ o.deadline=''; o.deadlineTime=''; o._dOpen=false; persist(); draw(); }},'✕'));
    return w;
  }
  function row(t, ti){
    const wrap=el('div',{class:'ted'+(taskDone(t)?' eddone':'')});
    const head=el('div',{class:'ted-h'});
    head.append(grip());
    if(checkable && !(t.subs && t.subs.length)){
      const box=el('div',{class:'box edbox'+(t.complete?' on':''), html:CHECK});
      box.addEventListener('click',()=>afterTask(p, t, todayISO()));
      head.append(box);
    }
    head.append(el('input',{class:'ted-t', value:t.name||'', placeholder:'Task '+(ti+1), oninput:e=>{ t.name=e.target.value; persist(); }}));
    head.append(el('button',{class:'del', style:'flex:none', onclick:()=>{ tasks.splice(ti,1); persist(); draw(); }},'✕'));
    wrap.append(head);
    const meta=el('div',{class:'ted-meta'});
    meta.append(dateChip(t));
    const sc=(t.subs||[]).length;
    meta.append(el('button',{class:'mini', onclick:()=>{ t._open=!t._open; draw(); }}, `${t._open?'▾':'▸'} ${sc} subtask${sc===1?'':'s'}`));
    if(taskDone(t)) meta.append(el('span',{class:'tiny', style:'color:var(--good)'},'✓ done'));
    wrap.append(meta);
    if(t._open){
      const sub=el('div',{class:'ted-subs'});
      (t.subs||[]).forEach((s,si)=>{
        const r=el('div',{class:'tsub'+(s.done?' eddone':'')});
        r.append(grip());
        if(checkable){
          const box=el('div',{class:'box edbox'+(s.done?' on':''), html:CHECK});
          box.addEventListener('click',()=>afterStep(p, s, todayISO()));
          r.append(box);
        }
        const col=el('div',{style:'flex:1;min-width:0'});
        col.append(el('input',{type:'text', value:s.text||'', placeholder:'Subtask '+(si+1), oninput:e=>{ s.text=e.target.value; persist(); }}));
        col.append(el('div',{class:'inline', style:'gap:4px;margin-top:4px;flex-wrap:wrap'}, [ dateChip(s) ]));
        r.append(col);
        r.append(el('button',{class:'del', style:'flex:none', onclick:()=>{ t.subs.splice(si,1); persist(); draw(); }},'✕'));
        sub.append(r);
      });
      sub.append(el('button',{class:'btn ghost sm', onclick:()=>{ (t.subs||(t.subs=[])).push({id:uid(), text:'', done:false, deadline:'', deadlineTime:'', completedAt:''}); persist(); draw(); }},'+ subtask'));
      wrap.append(sub);
      dragList(sub, (from,to)=>{ const [x]=t.subs.splice(from,1); t.subs.splice(to,0,x); persist(); draw(); });
    }
    return wrap;
  }
  function draw(){
    mount.innerHTML='';
    const list=el('div',{class:'tasklist'});
    tasks.forEach((t,ti)=> list.append(row(t, ti)));
    if(!tasks.length) list.append(el('div',{class:'empty tiny'},'No tasks yet — add the first one below.'));
    mount.append(list);
    mount.append(el('button',{class:'btn sm block', style:'margin-top:8px', onclick:()=>{
      tasks.push({id:uid(), name:'', deadline:'', deadlineTime:'', complete:false, completedAt:'', subs:[], _open:true}); persist(); draw();
    }},'+ Add task'));
    dragList(list, (from,to)=>{ const [x]=tasks.splice(from,1); tasks.splice(to,0,x); persist(); draw(); });
  }
  draw();
}

// New project = a centered, staged pop-up that still collects everything.
function newProject(){
  const dlg=$('#sheet');
  const STEPS=4;
  const D={ step:0, name:'', type:'', prio:'medium', deadline:'', deadlineTime:'', h:1, m:0, notes:'', tasks:[] };
  function grab(){
    const g=id=>{ const e=$('#'+id); return e?e.value:null; };
    if(g('w_name')!=null) D.name=g('w_name');
    if(g('w_type')!=null) D.type=g('w_type');
    if(g('w_dl')!=null) D.deadline=g('w_dl');
    if(g('w_dlt')!=null) D.deadlineTime=g('w_dlt');
    if(g('w_h')!=null) D.h=Math.max(0,Math.min(12,+g('w_h')||0));
    if(g('w_m')!=null) D.m=Math.max(0,Math.min(59,+g('w_m')||0));
    if(g('w_notes')!=null) D.notes=g('w_notes');
  }
  function draw(){
    grab();
    dlg.className='centered'; dlg.innerHTML=''; dlg.style.display='';
    const box=el('div',{class:'sheet'});
    box.append(el('div',{class:'wizdots'}, Array.from({length:STEPS},(_,i)=>el('i',{class:i<=D.step?'on':''}))));
    if(D.step===0){
      box.append(el('h2',{},'New project'));
      box.append(el('p',{class:'muted', style:'margin:2px 0 10px'},'What are you making?'));
      box.append(field('Title', `<input id="w_name" value="${esc(D.name)}" placeholder="Name this project">`));
      box.append(typeField('w_type', D.type));
    } else if(D.step===1){
      box.append(el('h2',{},'Priority & pace'));
      box.append(labeled('How important is this right now?', segmented(PPRIOS, D.prio, v=>D.prio=v)));
      box.append(el('div',{class:'faint tiny', style:'margin:-4px 0 10px'},'“Planning” keeps it off the nightly plan until you bump it up.'));
      box.append(el('div',{class:'grid2'},[
        field('Deadline (optional)', `<input id="w_dl" type="date" value="${D.deadline}">`),
        field('Time', `<input id="w_dlt" type="time" value="${D.deadlineTime}">`),
      ]));
      box.append(labeled('How long is one work session?', el('div',{class:'inline', style:'gap:10px'},[
        el('span',{class:'inline', style:'gap:4px'},[ el('input',{id:'w_h', type:'number', min:'0', max:'12', value:D.h, style:'width:64px'}), el('span',{class:'faint'},'h') ]),
        el('span',{class:'inline', style:'gap:4px'},[ el('input',{id:'w_m', type:'number', min:'0', max:'59', step:'5', value:D.m, style:'width:64px'}), el('span',{class:'faint'},'m') ]),
      ])));
    } else if(D.step===2){
      box.append(el('h2',{},'Break it into tasks'));
      box.append(el('p',{class:'muted', style:'margin:2px 0 8px'},'Ordered top to bottom — drag ⠿ to reorder. Open a task to add subtasks. You can refine all of this later.'));
      const mount=el('div',{});
      box.append(mount);
      taskBoard(mount, {parts:D.tasks}, ()=>{});
    } else {
      box.append(el('h2',{},'Notes'));
      box.append(el('p',{class:'muted', style:'margin:2px 0 8px'},'References, constraints, the vibe — anything worth keeping. Optional.'));
      box.append(field('', `<textarea id="w_notes" style="min-height:90px">${esc(D.notes)}</textarea>`));
    }
    const acts=el('div',{class:'row-actions', style:'margin-top:16px'});
    acts.append(el('button',{class:'btn ghost', onclick:()=>closeSheet()},'Cancel'));
    if(D.step>0) acts.append(el('button',{class:'btn ghost', onclick:()=>{ grab(); D.step--; draw(); }},'Back'));
    acts.append(el('button',{class:'btn primary', style:'margin-left:auto', onclick:()=>{
      grab();
      if(D.step===0 && !D.name.trim()){ const e=$('#w_name'); if(e) e.focus(); return; }
      if(D.step<STEPS-1){ D.step++; draw(); } else finish();
    }}, D.step<STEPS-1 ? 'Next' : 'Create project'));
    box.append(acts);
    dlg.append(box);
    if(typeof dlg.showModal==='function'){ if(!dlg.open) dlg.showModal(); }
    else { dlg.setAttribute('open',''); dlg.style.cssText='display:block;position:fixed;inset:0;z-index:100'; }
  }
  function finish(){
    grab();
    const name=D.name.trim(); if(!name){ D.step=0; draw(); return; }
    const parts=(D.tasks||[])
      .filter(t=>(t.name||'').trim() || (t.subs||[]).some(s=>(s.text||'').trim()))
      .map(t=>{
        const subs=(t.subs||[]).filter(s=>(s.text||'').trim()).map(s=>({id:s.id||uid(), text:s.text.trim(), done:!!s.done,
          deadline:s.deadline||'', deadlineTime:s.deadline?(s.deadlineTime||''):'', completedAt:''}));
        const complete = subs.length ? subs.every(s=>s.done) : !!t.complete;
        return {id:t.id||uid(), name:(t.name||'').trim()||'Task', deadline:t.deadline||'', deadlineTime:t.deadline?(t.deadlineTime||''):'',
          complete, completedAt: complete ? todayISO() : '', subs};
      });
    const np={id:uid(), name, type:D.type.trim(), priority:D.prio, deadline:D.deadline, deadlineTime:D.deadline?D.deadlineTime:'',
      minPerSession:Math.max(5, D.h*60+D.m)||60, color:nextColor(), notes:D.notes.trim(), subs:[], parts,
      archived:false, order:S.projects.length?Math.max(...S.projects.map(x=>x.order??0))+1:0, lastWorked:'', createdAt:todayISO(), completedAt:''};
    S.projects.push(np); save(); closeSheet(); openProject(np.id);
  }
  draw();
}
